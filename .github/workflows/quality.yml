name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep push generations independent because each validated main commit may
  # become an immutable container release. Supersede only repeated PR checks.
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate canonical documentation
        run: python scripts/docs_sync.py check

      - name: Enforce target-only production source boundary
        run: >-
          python scripts/verify_target_baseline_source.py
          --root .
          --contract docs/contracts/release-transition.json

      - name: Validate pull request synchronization
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/docs_sync.py check-change
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Validate pushed synchronization
        if: github.event_name == 'push'
        run: >-
          python scripts/docs_sync.py check-change
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"

      - name: Validate manually dispatched synchronization
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          base="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          if [[ -z "$base" || "$base" == "$(git rev-parse HEAD)" ]]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || printf '%040d' 0)"
          fi
          python scripts/docs_sync.py check-change --base "$base" --head HEAD

  backend-shard:
    name: Python shard ${{ matrix.shard }} of 0-3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: enterprise-agent-platform
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: enterprise-agent-platform/pyproject.toml

      - name: Install platform
        run: python -m pip install --no-input --editable .

      - name: Compile Python sources
        if: matrix.shard == 0
        run: python -m compileall -q enterprise_agent_platform tests

      - name: Run Python tests
        run: >-
          python ../scripts/python_test_shard.py
          --shard-index "${{ matrix.shard }}"
          --shard-count 4

  backend:
    name: Python 3.11
    if: ${{ always() }}
    needs: backend-shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Python shard
        env:
          SHARD_RESULT: ${{ needs['backend-shard'].result }}
        shell: bash
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            printf 'Python shards did not all succeed: %s\n' "$SHARD_RESULT" >&2
            exit 1
          fi

  frontend:
    name: Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: enterprise-agent-platform/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: enterprise-agent-platform/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run check

      - name: Run frontend tests
        run: npm test

      - name: Build browser assets
        run: npm run build

      - name: Verify generated assets are committed
        working-directory: .
        shell: bash
        run: |
          static_dir="enterprise-agent-platform/enterprise_agent_platform/static"
          git diff --exit-code -- "$static_dir"
          if [[ -n "$(git status --porcelain --untracked-files=all -- "$static_dir")" ]]; then
            echo "Generated browser assets are not in sync with frontend source." >&2
            git status --short --untracked-files=all -- "$static_dir" >&2
            exit 1
          fi

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  agent-runtime:
    name: Agent runtime (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: enterprise-agent-platform/agent-runtime
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: enterprise-agent-platform/agent-runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci

      - name: Build runtime once
        run: npm run build

      - name: Run runtime tests
        run: npm run test:compiled

      - name: Test Camoufox runtime patch
        working-directory: enterprise-agent-platform/camofox-runtime
        shell: bash
        run: |
          npm ci
          npm test

      - name: Audit runtime dependencies
        run: npm audit --audit-level=high

  manager:
    name: Manager (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: manager
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: manager/go.mod
          cache: true
          cache-dependency-path: manager/go.sum

      - name: Test manager
        run: go test -count=1 ./...

      - name: Vet manager
        run: go vet ./...

      - name: Build manager
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          stage="$(jq -er '.stage | select(. == "bridge" or . == "cleanup" or . == "target_baseline")' docs/contracts/release-transition.json)"
          command=./cmd/agent-platform-manager
          [[ "$stage" == bridge ]] && command=./cmd/ubitech-manager
          go -C manager build "$command"

  container-definitions:
    name: Container definitions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate Dockerfiles, Compose, and release schema
        run: scripts/container-smoke.sh
