name: Container release

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

env:
  # Bump to rebuild all built images (including unpinned package inputs).
  BUILD_INPUTS_SALT: "1"
  PINNED_INTEGRATION_IMAGES: |
    {
      "searxng": "ghcr.io/searxng/searxng@sha256:5286edb35782454ab8a102c5eff6b54bff745853191b46aeead95f225aa6dfb6"
    }

concurrency:
  # Build each main commit once; the final publish job separately
  # serializes the mutable main-channel pointer.
  group: container-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  prepare:
    name: Resolve release commit
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.release.outputs.source_commit }}
      image_matrix: ${{ steps.release.outputs.image_matrix }}
      image_namespace: ${{ steps.release.outputs.image_namespace }}
    steps:
      - name: Check out pushed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_commit" origin/main
          image_namespace="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image_matrix="$(python3 scripts/release_image_inputs.py --repository "$GITHUB_REPOSITORY" --salt "$BUILD_INPUTS_SALT")"
          {
            echo "source_commit=$source_commit"
            echo "image_matrix=$image_matrix"
            echo "image_namespace=$image_namespace"
          } >> "$GITHUB_OUTPUT"

  upstream-contracts:
    name: Validate managed upstream sources
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Verify immutable integration image indexes exist
        shell: bash
        run: |
          set -euo pipefail
          images="$(jq -er '.[]' <<< "$PINNED_INTEGRATION_IMAGES")"
          while IFS= read -r image; do
            raw="$(docker buildx imagetools inspect "$image" --raw)"
            jq -e '
              [.manifests[]?.platform | select(.os == "linux") | .architecture]
              | (index("amd64") != null and index("arm64") != null)
            ' <<<"$raw" >/dev/null
          done <<<"$images"

  images:
    name: Build ${{ matrix.component }} image
    needs:
      - prepare
      - upstream-contracts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.image_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.reuse_digest == ''
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        if: matrix.reuse_digest == ''
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        id: build
        if: matrix.reuse_digest == '' && matrix.component != 'agent-sandbox'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.base_contexts }}
          labels: io.agent-platform.build-inputs=${{ matrix.fingerprint }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}:${{ needs.prepare.outputs.source_commit }}${{ matrix.tag_suffix }}
          build-args: |
            SOURCE_COMMIT=${{ needs.prepare.outputs.source_commit }}
            RELEASE_VERSION=${{ needs.prepare.outputs.source_commit }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ env.BUILD_INPUTS_SALT }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ env.BUILD_INPUTS_SALT }}

      # The sandbox has only its stable build-input label, no commit labels/attestations.
      # Normalize config/layer timestamps and retain cache across release runners.
      - name: Build and push reproducible sandbox image
        id: sandbox
        if: matrix.reuse_digest == '' && matrix.component == 'agent-sandbox'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.base_contexts }}
          labels: io.agent-platform.build-inputs=${{ matrix.fingerprint }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ needs.prepare.outputs.image_namespace }}/agent-sandbox:${{ needs.prepare.outputs.source_commit }}
          build-args: SOURCE_DATE_EPOCH=0
          cache-from: type=registry,ref=ghcr.io/${{ needs.prepare.outputs.image_namespace }}/agent-sandbox:buildcache-${{ env.BUILD_INPUTS_SALT }}
          cache-to: type=registry,ref=ghcr.io/${{ needs.prepare.outputs.image_namespace }}/agent-sandbox:buildcache-${{ env.BUILD_INPUTS_SALT }},mode=max

      - name: Record immutable image identity
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}
          DIGEST: ${{ matrix.reuse_digest || steps.build.outputs.digest || steps.sandbox.outputs.digest }}
          REUSED: ${{ matrix.reuse_digest != '' }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          raw="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          jq -e '
            [.manifests[]?.platform | select(.os == "linux") | .architecture]
            | (index("amd64") != null and index("arm64") != null)
          ' <<<"$raw" >/dev/null
          jq -n \
            --arg component "$COMPONENT" \
            --arg reference "$IMAGE" \
            --arg digest "$DIGEST" \
            --argjson reused "$REUSED" \
            '{component:$component,reference:$reference,digest:$digest,reused:$reused}' \
            > "${COMPONENT}.json"

      - name: Upload image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  image-catalog:
    name: Assemble managed image catalog
    needs:
      - prepare
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release capacity contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download immutable image identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: image-*
          path: image-metadata
          merge-multiple: true

      - name: Assemble closed-world managed image catalog
        shell: bash
        run: |
          set -euo pipefail
          declare -A images=(
            [platform]="$(jq -er '.reference + "@" + .digest' image-metadata/platform.json)"
            [agent-runtime]="$(jq -er '.reference + "@" + .digest' image-metadata/agent-runtime.json)"
            [camofox]="$(jq -er '.reference + "@" + .digest' image-metadata/camofox.json)"
            [agent-sandbox]="$(jq -er '.reference + "@" + .digest' image-metadata/agent-sandbox.json)"
          )
          integrations="$(jq -er 'to_entries[] | [.key, .value] | @tsv' <<< "$PINNED_INTEGRATION_IMAGES")"
          while IFS=$'\t' read -r component image; do
            [[ -n "$component" && -z "${images[$component]+present}" ]] || {
              echo "Invalid or overlapping pinned integration image: ${component}" >&2
              exit 1
            }
            images["$component"]="$image"
          done <<<"$integrations"
          mapfile -t components < <(jq -er '.managed_image_capacity_estimates | keys[]' docs/contracts/container-platform.json)
          [[ "${#components[@]}" -eq 5 && "${#images[@]}" -eq "${#components[@]}" ]]
          for component in "${components[@]}"; do
            image="${images[$component]-}"
            [[ "$image" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
              echo "Canonical managed image ${component} is missing an immutable release reference" >&2
              exit 1
            }
            jq -n --arg key "$component" --arg value "$image" '{key:$key,value:$value}'
          done | jq -se 'map({(.key): .value}) | add' > managed-images.json
          jq -e --slurpfile catalog managed-images.json '
            (.managed_image_capacity_estimates | keys) == ($catalog[0] | keys)
          ' docs/contracts/container-platform.json >/dev/null
          jq -se '
            map(select(.reused == true) | {(.component): (.reference + "@" + .digest)})
            | add // {}
          ' image-metadata/*.json > reused-images.json

      - name: Upload managed image catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-images
          path: |
            managed-images.json
            reused-images.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  public-images:
    name: Verify anonymous linux/${{ matrix.architecture }} images
    needs:
      - prepare
      - image-catalog
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out release capacity contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download managed image catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          name: managed-images
          path: artifacts

      - name: Require release packages to be public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          [[ "$owner" =~ ^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$ ]]
          [[ ${#repository} -le 100 && "$repository" =~ ^[a-z0-9._-]+$ ]]
          owner_type="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/users/${owner}" --jq '.type')"
          case "$owner_type" in
            Organization) package_base="/orgs/${owner}/packages/container" ;;
            User) package_base="/user/packages/container" ;;
            *) echo "Unsupported package owner type: $owner_type" >&2; exit 1 ;;
          esac

          package_components=(platform agent-runtime camofox agent-sandbox)
          for component in "${package_components[@]}"; do
            package_component="$component"
            package="${repository}/${package_component}"
            reference="$(jq -er --arg component "$component" '.[$component] | split("@")[0]' artifacts/managed-images.json)"
            expected_reference="ghcr.io/${owner}/${package}"
            [[ "$reference" == "$expected_reference" ]] || {
              echo "Unexpected image reference for ${component}: ${reference}" >&2
              exit 1
            }
            encoded_package="$(jq -rn --arg value "$package" '$value | @uri')"
            endpoint="${package_base}/${encoded_package}"
            package_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$endpoint")"
            jq -e \
                --arg owner "$owner" \
                --arg package "$package" '
                  .package_type == "container" and
                  (.owner.login | ascii_downcase) == $owner and
                  (.name | ascii_downcase) == $package
                ' <<<"$package_json" >/dev/null
            visibility="$(jq -er '.visibility' <<<"$package_json")"
            if [[ "$visibility" != public ]]; then
              settings_url="$(jq -er '.html_url | select(startswith("https://github.com/"))' <<<"$package_json")/settings"
              echo "::error title=GHCR package is not public::Set ${package} to Public once at ${settings_url}, then rerun this release. GitHub exposes no supported package-visibility mutation API, so publication fails closed."
              exit 1
            fi
          done

      - name: Verify final digests and pull newly built images anonymously
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          [[ "$ARCHITECTURE" == amd64 || "$ARCHITECTURE" == arm64 ]]
          anonymous_config="$(mktemp -d "${RUNNER_TEMP}/anonymous-docker.XXXXXX")"
          cleanup() { rm -rf "$anonymous_config"; }
          trap cleanup EXIT
          chmod 0700 "$anonymous_config"
          printf '{}\n' > "$anonymous_config/config.json"
          chmod 0600 "$anonymous_config/config.json"
          export DOCKER_CONFIG="$anonymous_config"
          unset DOCKER_AUTH_CONFIG REGISTRY_AUTH_FILE
          jq -e '
            ((.auths // {}) | length) == 0 and
            (has("credsStore") | not) and
            (has("credHelpers") | not)
          ' "$DOCKER_CONFIG/config.json" >/dev/null

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"

          remove_exact_local_image() {
            local reference="$1"
            local expected_id="${2:-}"
            local local_id=""
            if local_id="$(docker image inspect "$reference" --format '{{.Id}}' 2>/dev/null)"; then
              [[ "$local_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "Docker returned an invalid image ID for ${reference}: ${local_id}" >&2
                exit 1
              }
              if [[ -n "$expected_id" && "$local_id" != "$expected_id" ]]; then
                echo "Refusing to remove ${reference}: expected ${expected_id}, found ${local_id}" >&2
                exit 1
              fi
              docker image rm --force "$local_id"
            elif [[ -n "$expected_id" ]]; then
              echo "Expected pulled image ${reference} (${expected_id}) is already missing" >&2
              exit 1
            fi
            docker info --format '{{.ServerVersion}}' >/dev/null
            if docker image inspect "$reference" >/dev/null 2>&1; then
              echo "Exact image reference remains after cleanup: ${reference}" >&2
              exit 1
            fi
            if [[ -n "$local_id" ]] && docker image inspect "$local_id" >/dev/null 2>&1; then
              echo "Exact image ID remains after cleanup: ${local_id}" >&2
              exit 1
            fi
          }

          declare -A images=()
          while IFS=$'\t' read -r component image; do
            images["$component"]="$image"
          done < <(jq -er 'to_entries | sort_by(.key)[] | [.key, .value] | @tsv' artifacts/managed-images.json)
          mapfile -t components < <(jq -er '
            .managed_image_capacity_estimates | keys[]
          ' docs/contracts/container-platform.json)
          expected_count=5
          [[ "${#components[@]}" -eq "$expected_count" && "${#images[@]}" -eq "${#components[@]}" ]]

          for component in "${components[@]}"; do
            image="${images[$component]-}"
            [[ "$image" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
              echo "Canonical managed image ${component} is missing an immutable release reference" >&2
              exit 1
            }
            case "$component" in
              platform|agent-runtime|camofox|agent-sandbox)
                package_component="$component"
                package="${repository}/${package_component}"
                digest="${image##*@}"
                anonymous_token="$(env -u GH_TOKEN -u GITHUB_TOKEN curl -q \
                  --fail --silent --show-error --get \
                  --data-urlencode 'service=ghcr.io' \
                  --data-urlencode "scope=repository:${owner}/${package}:pull" \
                  'https://ghcr.io/token' | jq -er '.token | select(type == "string" and length > 0)')"
                manifest_headers="$(env -u GH_TOKEN -u GITHUB_TOKEN curl -q \
                  --fail --silent --show-error --head \
                  --header "Authorization: Bearer ${anonymous_token}" \
                  --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                  "https://ghcr.io/v2/${owner}/${package}/manifests/${digest}")"
                registry_digest="$(awk 'BEGIN {IGNORECASE=1} $1 == "docker-content-digest:" {gsub("\r", "", $2); print tolower($2)}' <<<"$manifest_headers" | tail -n 1)"
                [[ "$registry_digest" == "$digest" ]] || {
                  echo "Anonymous registry metadata returned ${registry_digest:-no digest} for ${image}" >&2
                  exit 1
                }
                ;;
            esac

            compressed_limit="$(jq -er --arg component "$component" '.managed_image_capacity_estimates[$component].compressed_bytes' docs/contracts/container-platform.json)"
            unpacked_limit="$(jq -er --arg component "$component" '.managed_image_capacity_estimates[$component].unpacked_bytes' docs/contracts/container-platform.json)"
            index_raw="$(docker buildx imagetools inspect "$image" --raw)"
            image_repository="${image%@*}"
            platform_digest="$(jq -er --arg architecture "$ARCHITECTURE" '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest]
                | if length == 1 then .[0] else error("release index has an ambiguous platform manifest") end
              ' <<<"$index_raw")"
            platform_raw="$(docker buildx imagetools inspect "${image_repository}@${platform_digest}" --raw)"
            compressed_bytes="$(jq -er '[.config.size, (.layers[]?.size)] | add | select(type == "number" and . > 0)' <<<"$platform_raw")"
            if (( compressed_bytes > compressed_limit )); then
              echo "${component} linux/${ARCHITECTURE} compressed size ${compressed_bytes} exceeds contract limit ${compressed_limit}" >&2
              exit 1
            fi
            if jq -e --arg component "$component" --arg image "$image" \
              '.[$component] == $image' artifacts/reused-images.json >/dev/null; then
              echo "Verified reused ${component} linux/${ARCHITECTURE} manifest: ${image}"
              continue
            fi
            remove_exact_local_image "$image"
            docker pull --platform "linux/${ARCHITECTURE}" "$image"
            pulled_metadata="$(docker image inspect "$image")"
            jq -e --arg image "$image" --arg architecture "$ARCHITECTURE" '
              length == 1 and
              .[0].Os == "linux" and
              .[0].Architecture == $architecture and
              (.[0].RepoDigests | index($image) != null)
            ' <<<"$pulled_metadata" >/dev/null
            pulled_id="$(jq -er '
              if length == 1
              then .[0].Id | select(test("^sha256:[0-9a-f]{64}$"))
              else error("Docker returned an ambiguous pulled image")
              end
            ' <<<"$pulled_metadata")"
            unpacked_bytes="$(jq -er '
              if length == 1
              then .[0].Size | select(type == "number" and . > 0)
              else error("Docker returned an ambiguous pulled image")
              end
            ' <<<"$pulled_metadata")"
            [[ "$unpacked_bytes" =~ ^[0-9]+$ ]]
            if (( unpacked_bytes > unpacked_limit )); then
              echo "${component} linux/${ARCHITECTURE} unpacked size ${unpacked_bytes} exceeds contract limit ${unpacked_limit}" >&2
              exit 1
            fi
            remove_exact_local_image "$image" "$pulled_id"
          done

          jq -e '
            ((.auths // {}) | length) == 0 and
            (has("credsStore") | not) and
            (has("credHelpers") | not)
          ' "$DOCKER_CONFIG/config.json" >/dev/null

  manager-binaries:
    name: Manager linux/${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: manager/go.mod
          cache: true
          cache-dependency-path: manager/go.sum

      - name: Build static manager
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p dist
          output="dist/agent-platform-manager-linux-${GOARCH}"
          CGO_ENABLED=0 GOOS=linux go -C manager build \
            -trimpath \
            -ldflags "-s -w -buildid= -X main.version=${SOURCE_COMMIT}" \
            -o "../$output" \
            ./cmd/agent-platform-manager
          test -s "$output"
          (cd dist && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload manager binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manager-${{ matrix.arch }}
          path: |
            dist/agent-platform-manager-linux-${{ matrix.arch }}
            dist/agent-platform-manager-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  manager-systemd-integration:
    name: Manager user-systemd activation gate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: manager/go.mod
          cache: true
          cache-dependency-path: manager/go.sum

      - name: Start the runner user-systemd manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          runtime_dir="/run/user/${uid}"
          bus="unix:path=${runtime_dir}/bus"
          for _ in $(seq 1 30); do
            if XDG_RUNTIME_DIR="$runtime_dir" DBUS_SESSION_BUS_ADDRESS="$bus" \
              systemctl --user show-environment >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          XDG_RUNTIME_DIR="$runtime_dir" DBUS_SESSION_BUS_ADDRESS="$bus" \
            systemctl --user show-environment >/dev/null
          XDG_RUNTIME_DIR="$runtime_dir" DBUS_SESSION_BUS_ADDRESS="$bus" \
            systemd-run --user --quiet --wait --collect --property=Type=oneshot /usr/bin/true
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "DBUS_SESSION_BUS_ADDRESS=$bus"
          } >> "$GITHUB_ENV"

      - name: Verify real Manager restart and watchdog cgroups
        working-directory: manager
        env:
          AGENT_PLATFORM_SYSTEMD_INTEGRATION: "1"
        run: |
          set -euo pipefail
          go test -count=1 -v \
            -run '^Test(RecoverySystemdQuiescenceIntegration|OrdinarySystemdActivationRestartIntegration)$' \
            ./internal/selfupdate

  compose-smoke:
    name: Core Compose smoke test
    needs:
      - prepare
      - image-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download managed image catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          name: managed-images
          path: artifacts

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start and probe the core stack
        shell: bash
        run: scripts/release-compose-smoke.sh

  publish:
    name: Publish atomic main release
    needs:
      - quality
      - prepare
      - upstream-contracts
      - images
      - image-catalog
      - manager-binaries
      - manager-systemd-integration
      - compose-smoke
      - public-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: read
    concurrency:
      group: container-channel-main
      cancel-in-progress: false
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download managed image catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          name: managed-images
          path: artifacts

      - name: Download Manager binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: manager-*
          path: artifacts
          merge-multiple: true

      - name: Assemble release directory
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release"
          mkdir -p "$stage"
          for architecture in amd64 arm64; do
            binary="agent-platform-manager-linux-${architecture}"
            cp "artifacts/${binary}" "$stage/${binary}"
            cp "artifacts/${binary}.sha256" "$stage/${binary}.sha256"
            chmod 0755 "$stage/${binary}"
          done
          cp containers/compose.yaml "$stage/agent-platform-compose.yaml"
          cp install.sh "$stage/install.sh"
          chmod 0755 "$stage/install.sh"
          bash -n "$stage/install.sh"
          (cd "$stage" && sha256sum install.sh > install.sh.sha256)

          jq -ecS '
            select(length == 5) |
            select(
              keys == [
                "agent-runtime", "agent-sandbox", "camofox", "platform", "searxng"
              ]
            ) |
            select(all(.[]; test("^[^@\\s]+@sha256:[0-9a-f]{64}$")))
          ' artifacts/managed-images.json > "$stage/verified-managed-images.json"

          release_tag="container-${SOURCE_COMMIT}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          generated_at="$(git show -s --format=%cI "$SOURCE_COMMIT")"
          database_schema_version="$(jq -er '.database_schema_version | select(type == "number" and . >= 1)' docs/contracts/container-platform.json)"
          amd64_sha="$(sha256sum "$stage/agent-platform-manager-linux-amd64" | awk '{print $1}')"
          arm64_sha="$(sha256sum "$stage/agent-platform-manager-linux-arm64" | awk '{print $1}')"
          compose_sha="$(sha256sum "$stage/agent-platform-compose.yaml" | awk '{print $1}')"
          grep -Fx "${amd64_sha}  agent-platform-manager-linux-amd64" \
            "$stage/agent-platform-manager-linux-amd64.sha256"
          grep -Fx "${arm64_sha}  agent-platform-manager-linux-arm64" \
            "$stage/agent-platform-manager-linux-arm64.sha256"
          python3 scripts/assemble_release_manifest.py \
            --images "$stage/verified-managed-images.json" \
            --generation "$SOURCE_COMMIT" \
            --generated-at "$generated_at" \
            --database-schema-version "$database_schema_version" \
            --manager-amd64-url "$release_base/agent-platform-manager-linux-amd64" \
            --manager-amd64-sha256 "$amd64_sha" \
            --manager-arm64-url "$release_base/agent-platform-manager-linux-arm64" \
            --manager-arm64-sha256 "$arm64_sha" \
            --compose-url "$release_base/agent-platform-compose.yaml" \
            --compose-sha256 "$compose_sha" \
            --output "$stage/release.json"
          rm "$stage/verified-managed-images.json"

          python3 - "$stage" <<'PY'
          import os
          import pathlib
          import stat
          import sys

          root = pathlib.Path(sys.argv[1])
          expected = {
              "agent-platform-compose.yaml",
              "agent-platform-manager-linux-amd64",
              "agent-platform-manager-linux-amd64.sha256",
              "agent-platform-manager-linux-arm64",
              "agent-platform-manager-linux-arm64.sha256",
              "install.sh",
              "install.sh.sha256",
              "release.json",
          }
          actual = {entry.name for entry in os.scandir(root)}
          if actual != expected:
              raise SystemExit(f"release directory is not closed: {sorted(actual ^ expected)}")
          for name in expected:
              path = root / name
              mode = path.lstat().st_mode
              if not stat.S_ISREG(mode) or path.is_symlink() or path.stat().st_size <= 0:
                  raise SystemExit(f"invalid release asset: {name}")
          PY

      - name: Publish immutable release and advance main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          release_tag="container-${SOURCE_COMMIT}"
          current="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$current" =~ ^container-([0-9a-f]{40})$ ]]
          current_commit="${BASH_REMATCH[1]}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git merge-base --is-ancestor "$current_commit" "$SOURCE_COMMIT" || {
            echo "Refusing an out-of-order or divergent release" >&2
            exit 1
          }

          # Create once: never move an existing tag or replace published assets.
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${release_tag}" -f "sha=${SOURCE_COMMIT}" >/dev/null
          gh release create "$release_tag" "$stage"/* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --verify-tag \
            --draft --title "Agent Platform ${SOURCE_COMMIT:0:12}"
          # Public download URLs cannot be tested while the release is a draft.
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          public="$RUNNER_TEMP/public-release"
          mkdir "$public"
          for asset in "$stage"/*; do
            name="${asset##*/}"
            env -u GH_TOKEN -u GITHUB_TOKEN curl -q --fail --silent --show-error --location \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${name}" \
              --output "$public/$name"
            cmp "$asset" "$public/$name"
          done
          scripts/verify-release-images-anonymous.sh "$public/release.json"
          # This job holds container-channel-main throughout verification and promotion.
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --latest
