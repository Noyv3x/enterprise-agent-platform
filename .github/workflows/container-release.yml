name: Container release

on:
  workflow_run:
    workflows:
      - Quality gates
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to release after its quality workflow succeeded
        required: true
        default: main

permissions:
  actions: read
  contents: read

concurrency:
  # A deployment may have pulled any qualified main commit, so a newer workflow
  # must not evict its pending exact release. Channel monotonicity is enforced
  # separately when the immutable release is made public.
  group: container-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.release.outputs.source_commit }}
      transition_stage: ${{ steps.release.outputs.transition_stage }}
      manager_command: ${{ steps.release.outputs.manager_command }}
      image_matrix: ${{ steps.release.outputs.image_matrix }}
      image_namespace: ${{ steps.release.outputs.image_namespace }}
      cognee_revision: ${{ steps.release.outputs.cognee_revision }}
      firecrawl_revision: ${{ steps.release.outputs.firecrawl_revision }}
    steps:
      - name: Check out qualified source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release inputs
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_commit" origin/main
          image_namespace="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          cognee_revision="$(jq -er '.sources.cognee.revision | select(test("^[0-9a-f]{40}$"))' docs/contracts/upstream-sources.json)"
          firecrawl_revision="$(jq -er '.sources.firecrawl.revision | select(test("^[0-9a-f]{40}$"))' docs/contracts/upstream-sources.json)"
          transition_stage="$(jq -er '.stage | select(. == "bridge" or . == "cleanup" or . == "target_baseline")' docs/contracts/release-transition.json)"
          if [[ "$transition_stage" == target_baseline ]]; then
            transition_predecessor="$(jq -er '.predecessor_generation | select(test("^[0-9a-f]{40}$"))' docs/contracts/release-transition.json)"
            current_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            if [[ ! "$current_tag" =~ ^container-([0-9a-f]{40})$ ]]; then
              echo "Target baseline latest is not an immutable generation: ${current_tag}" >&2
              exit 1
            fi
            current_generation="${BASH_REMATCH[1]}"
            git merge-base --is-ancestor "$transition_predecessor" "$current_generation" || {
              echo "Target baseline is waiting for its canonical Cleanup ancestry: ${current_tag}" >&2
              exit 1
            }
            git merge-base --is-ancestor "$current_generation" "$source_commit" || {
              echo "Target baseline latest is not an ancestor of this candidate: ${current_tag}" >&2
              exit 1
            }
          fi
          manager_command=./cmd/agent-platform-manager
          image_matrix='{"include":[{"component":"platform","dockerfile":"containers/platform.Dockerfile","image":"platform","tag_suffix":""},{"component":"agent-runtime","dockerfile":"containers/agent-runtime.Dockerfile","image":"agent-runtime","tag_suffix":""},{"component":"camofox","dockerfile":"containers/camofox.Dockerfile","image":"camofox","tag_suffix":""},{"component":"agent-sandbox","dockerfile":"containers/agent-sandbox.Dockerfile","image":"agent-sandbox","tag_suffix":""}]}'
          if [[ "$transition_stage" == bridge ]]; then
            manager_command=./cmd/ubitech-manager
            image_matrix="$(jq -c '.include += [{component:"handoff-fs-helper",dockerfile:"containers/handoff-fs-helper.Dockerfile",image:"platform",tag_suffix:"-handoff-fs-helper"}]' <<<"$image_matrix")"
          fi
          {
            echo "source_commit=$source_commit"
            echo "transition_stage=$transition_stage"
            echo "manager_command=$manager_command"
            echo "image_matrix=$image_matrix"
            echo "image_namespace=$image_namespace"
            echo "cognee_revision=$cognee_revision"
            echo "firecrawl_revision=$firecrawl_revision"
          } >> "$GITHUB_OUTPUT"

      - name: Require a successful quality run for manual releases
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          successful="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?head_sha=${SOURCE_COMMIT}&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$successful" -lt 1 ]]; then
            echo "No successful pushed Quality gates run exists for $SOURCE_COMMIT" >&2
            exit 1
          fi

      - name: Recheck container definitions
        run: scripts/container-smoke.sh

      - name: Recheck target-only production source boundary
        run: >-
          python3 scripts/verify_target_baseline_source.py
          --root .
          --contract docs/contracts/release-transition.json

  upstream-contracts:
    name: Validate managed upstream sources
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Validate exact Cognee and Firecrawl revisions
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          git -C "$root" init cognee
          git -C "$root/cognee" remote add origin https://github.com/topoteretes/cognee.git
          git -C "$root/cognee" fetch --depth=1 origin '${{ needs.prepare.outputs.cognee_revision }}'
          git -C "$root/cognee" checkout --detach FETCH_HEAD
          test "$(git -C "$root/cognee" rev-parse HEAD)" = '${{ needs.prepare.outputs.cognee_revision }}'
          test -f "$root/cognee/pyproject.toml"
          test -f "$root/cognee/cognee/__init__.py"

          git -C "$root" init firecrawl
          git -C "$root/firecrawl" remote add origin https://github.com/firecrawl/firecrawl.git
          git -C "$root/firecrawl" fetch --depth=1 origin '${{ needs.prepare.outputs.firecrawl_revision }}'
          git -C "$root/firecrawl" checkout --detach FETCH_HEAD
          test "$(git -C "$root/firecrawl" rev-parse HEAD)" = '${{ needs.prepare.outputs.firecrawl_revision }}'
          test -f "$root/firecrawl/docker-compose.yaml"
          docker compose -f "$root/firecrawl/docker-compose.yaml" config --services | sort > "$root/actual-services"
          jq -r '.sources.firecrawl.compose_services[]' docs/contracts/upstream-sources.json |
            while IFS= read -r service; do
              grep -Fxq "$service" "$root/actual-services" || {
                echo "Managed Firecrawl service is absent from the locked upstream revision: $service" >&2
                exit 1
              }
            done

      - name: Verify immutable integration image indexes exist
        shell: bash
        run: |
          set -euo pipefail
          images=(
            'ghcr.io/searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812'
            'ghcr.io/firecrawl/firecrawl@sha256:c2e8fc46fbc9dba57463b4b4f5c23fffe2aaf578a7691c5aaaf2cae58a01f80c'
            'ghcr.io/firecrawl/playwright-service@sha256:6359b0d9070f27400b4a9b615509be06919e40121fc1fdc42d4efeddf02653d2'
            'ghcr.io/firecrawl/nuq-postgres@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6'
            'redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005'
            'rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69'
          )
          for image in "${images[@]}"; do
            raw="$(docker buildx imagetools inspect "$image" --raw)"
            jq -e '
              [.manifests[]?.platform | select(.os == "linux") | .architecture]
              | (index("amd64") != null and index("arm64") != null)
            ' <<<"$raw" >/dev/null
          done

  images:
    name: Build ${{ matrix.component }} image
    needs:
      - prepare
      - upstream-contracts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.image_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}:${{ needs.prepare.outputs.source_commit }}${{ matrix.tag_suffix }}
          build-args: |
            SOURCE_COMMIT=${{ needs.prepare.outputs.source_commit }}
            RELEASE_VERSION=${{ needs.prepare.outputs.source_commit }}
            COGNEE_REVISION=${{ needs.prepare.outputs.cognee_revision }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Record immutable image identity
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          raw="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          jq -e '
            [.manifests[]?.platform | select(.os == "linux") | .architecture]
            | (index("amd64") != null and index("arm64") != null)
          ' <<<"$raw" >/dev/null
          jq -n \
            --arg component "$COMPONENT" \
            --arg reference "$IMAGE" \
            --arg digest "$DIGEST" \
            '{component:$component,reference:$reference,digest:$digest}' \
            > "${COMPONENT}.json"

      - name: Upload image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  public-images:
    name: Verify anonymously pullable images
    needs:
      - prepare
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out release capacity contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download immutable image identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: image-metadata
          merge-multiple: true

      - name: Require release packages to be public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSITION_STAGE: ${{ needs.prepare.outputs.transition_stage }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          [[ "$owner" =~ ^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$ ]]
          [[ ${#repository} -le 100 && "$repository" =~ ^[a-z0-9._-]+$ ]]
          owner_type="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/users/${owner}" --jq '.type')"
          case "$owner_type" in
            Organization) package_base="/orgs/${owner}/packages/container" ;;
            User) package_base="/user/packages/container" ;;
            *) echo "Unsupported package owner type: $owner_type" >&2; exit 1 ;;
          esac

          package_components=(platform agent-runtime camofox agent-sandbox)
          if [[ "$TRANSITION_STAGE" == bridge ]]; then
            package_components+=(handoff-fs-helper)
          fi
          for component in "${package_components[@]}"; do
            metadata="image-metadata/${component}.json"
            package_component="$component"
            if [[ "$component" == handoff-fs-helper ]]; then
              package_component=platform
            fi
            package="${repository}/${package_component}"
            reference="$(jq -er '.reference' "$metadata")"
            expected_reference="ghcr.io/${owner}/${package}"
            [[ "$reference" == "$expected_reference" ]] || {
              echo "Unexpected image reference for ${component}: ${reference}" >&2
              exit 1
            }
            encoded_package="$(jq -rn --arg value "$package" '$value | @uri')"
            endpoint="${package_base}/${encoded_package}"
            package_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$endpoint")"
            jq -e \
                --arg owner "$owner" \
                --arg package "$package" '
                  .package_type == "container" and
                  (.owner.login | ascii_downcase) == $owner and
                  (.name | ascii_downcase) == $package
                ' <<<"$package_json" >/dev/null
            visibility="$(jq -er '.visibility' <<<"$package_json")"
            if [[ "$visibility" != public ]]; then
              settings_url="$(jq -er '.html_url | select(startswith("https://github.com/"))' <<<"$package_json")/settings"
              echo "::error title=GHCR package is not public::Set ${package} to Public once at ${settings_url}, then rerun this release. GitHub exposes no supported package-visibility mutation API, so publication fails closed."
              exit 1
            fi
          done

      - name: Pull every final digest without registry credentials
        shell: bash
        env:
          TRANSITION_STAGE: ${{ needs.prepare.outputs.transition_stage }}
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d "${RUNNER_TEMP}/anonymous-docker.XXXXXX")"
          cleanup() { rm -rf "$anonymous_config"; }
          trap cleanup EXIT
          chmod 0700 "$anonymous_config"
          printf '{}\n' > "$anonymous_config/config.json"
          chmod 0600 "$anonymous_config/config.json"
          export DOCKER_CONFIG="$anonymous_config"
          unset DOCKER_AUTH_CONFIG REGISTRY_AUTH_FILE
          jq -e '
            ((.auths // {}) | length) == 0 and
            (has("credsStore") | not) and
            (has("credHelpers") | not)
          ' "$DOCKER_CONFIG/config.json" >/dev/null

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"

          remove_exact_local_image() {
            local reference="$1"
            local expected_id="${2:-}"
            local local_id=""
            if local_id="$(docker image inspect "$reference" --format '{{.Id}}' 2>/dev/null)"; then
              [[ "$local_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "Docker returned an invalid image ID for ${reference}: ${local_id}" >&2
                exit 1
              }
              if [[ -n "$expected_id" && "$local_id" != "$expected_id" ]]; then
                echo "Refusing to remove ${reference}: expected ${expected_id}, found ${local_id}" >&2
                exit 1
              fi
              docker image rm --force "$local_id"
            elif [[ -n "$expected_id" ]]; then
              echo "Expected pulled image ${reference} (${expected_id}) is already missing" >&2
              exit 1
            fi
            docker info --format '{{.ServerVersion}}' >/dev/null
            if docker image inspect "$reference" >/dev/null 2>&1; then
              echo "Exact image reference remains after cleanup: ${reference}" >&2
              exit 1
            fi
            if [[ -n "$local_id" ]] && docker image inspect "$local_id" >/dev/null 2>&1; then
              echo "Exact image ID remains after cleanup: ${local_id}" >&2
              exit 1
            fi
          }

          declare -A images=(
            [platform]="$(jq -er '
              select(.reference | test("^ghcr\\.io/[a-z0-9._/-]+$")) |
              select(.digest | test("^sha256:[0-9a-f]{64}$")) |
              .reference + "@" + .digest
            ' image-metadata/platform.json)"
            [agent-runtime]="$(jq -er '
              select(.reference | test("^ghcr\\.io/[a-z0-9._/-]+$")) |
              select(.digest | test("^sha256:[0-9a-f]{64}$")) |
              .reference + "@" + .digest
            ' image-metadata/agent-runtime.json)"
            [camofox]="$(jq -er '
              select(.reference | test("^ghcr\\.io/[a-z0-9._/-]+$")) |
              select(.digest | test("^sha256:[0-9a-f]{64}$")) |
              .reference + "@" + .digest
            ' image-metadata/camofox.json)"
            [agent-sandbox]="$(jq -er '
              select(.reference | test("^ghcr\\.io/[a-z0-9._/-]+$")) |
              select(.digest | test("^sha256:[0-9a-f]{64}$")) |
              .reference + "@" + .digest
            ' image-metadata/agent-sandbox.json)"
            [searxng]='ghcr.io/searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812'
            [firecrawl-api]='ghcr.io/firecrawl/firecrawl@sha256:c2e8fc46fbc9dba57463b4b4f5c23fffe2aaf578a7691c5aaaf2cae58a01f80c'
            [firecrawl-playwright]='ghcr.io/firecrawl/playwright-service@sha256:6359b0d9070f27400b4a9b615509be06919e40121fc1fdc42d4efeddf02653d2'
            [firecrawl-postgres]='ghcr.io/firecrawl/nuq-postgres@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6'
            [firecrawl-redis]='redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005'
            [firecrawl-rabbitmq]='rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69'
          )
          if [[ "$TRANSITION_STAGE" == bridge ]]; then
            images[handoff-fs-helper]="$(jq -er '
              select(.reference | test("^ghcr\\.io/[a-z0-9._/-]+$")) |
              select(.digest | test("^sha256:[0-9a-f]{64}$")) |
              .reference + "@" + .digest
            ' image-metadata/handoff-fs-helper.json)"
          fi
          mapfile -t components < <(jq -er --arg stage "$TRANSITION_STAGE" '
            .managed_image_capacity_estimates | keys[] |
            select($stage == "bridge" or . != "handoff-fs-helper")
          ' docs/contracts/container-platform.json)
          expected_count=10
          [[ "$TRANSITION_STAGE" == bridge ]] && expected_count=11
          [[ "${#components[@]}" -eq "$expected_count" && "${#images[@]}" -eq "${#components[@]}" ]]

          for component in "${components[@]}"; do
            image="${images[$component]-}"
            [[ "$image" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
              echo "Canonical managed image ${component} is missing an immutable release reference" >&2
              exit 1
            }
            case "$component" in
              platform|agent-runtime|camofox|agent-sandbox|handoff-fs-helper)
                package_component="$component"
                if [[ "$component" == handoff-fs-helper ]]; then
                  package_component=platform
                fi
                package="${repository}/${package_component}"
                digest="${image##*@}"
                anonymous_token="$(env -u GH_TOKEN -u GITHUB_TOKEN curl -q \
                  --fail --silent --show-error --get \
                  --data-urlencode 'service=ghcr.io' \
                  --data-urlencode "scope=repository:${owner}/${package}:pull" \
                  'https://ghcr.io/token' | jq -er '.token | select(type == "string" and length > 0)')"
                manifest_headers="$(env -u GH_TOKEN -u GITHUB_TOKEN curl -q \
                  --fail --silent --show-error --head \
                  --header "Authorization: Bearer ${anonymous_token}" \
                  --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                  "https://ghcr.io/v2/${owner}/${package}/manifests/${digest}")"
                registry_digest="$(awk 'BEGIN {IGNORECASE=1} $1 == "docker-content-digest:" {gsub("\r", "", $2); print tolower($2)}' <<<"$manifest_headers" | tail -n 1)"
                [[ "$registry_digest" == "$digest" ]] || {
                  echo "Anonymous registry metadata returned ${registry_digest:-no digest} for ${image}" >&2
                  exit 1
                }
                ;;
            esac

            compressed_limit="$(jq -er --arg component "$component" '.managed_image_capacity_estimates[$component].compressed_bytes' docs/contracts/container-platform.json)"
            unpacked_limit="$(jq -er --arg component "$component" '.managed_image_capacity_estimates[$component].unpacked_bytes' docs/contracts/container-platform.json)"
            index_raw="$(docker buildx imagetools inspect "$image" --raw)"
            image_repository="${image%@*}"
            for architecture in amd64 arm64; do
              platform_digest="$(jq -er --arg architecture "$architecture" '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest]
                | if length == 1 then .[0] else error("release index has an ambiguous platform manifest") end
              ' <<<"$index_raw")"
              platform_raw="$(docker buildx imagetools inspect "${image_repository}@${platform_digest}" --raw)"
              compressed_bytes="$(jq -er '[.config.size, (.layers[]?.size)] | add | select(type == "number" and . > 0)' <<<"$platform_raw")"
              if (( compressed_bytes > compressed_limit )); then
                echo "${component} linux/${architecture} compressed size ${compressed_bytes} exceeds contract limit ${compressed_limit}" >&2
                exit 1
              fi
              remove_exact_local_image "$image"
              docker pull --platform "linux/${architecture}" "$image"
              pulled_metadata="$(docker image inspect "$image")"
              jq -e --arg image "$image" --arg architecture "$architecture" '
                length == 1 and
                .[0].Os == "linux" and
                .[0].Architecture == $architecture and
                (.[0].RepoDigests | index($image) != null)
              ' <<<"$pulled_metadata" >/dev/null
              pulled_id="$(jq -er '
                if length == 1
                then .[0].Id | select(test("^sha256:[0-9a-f]{64}$"))
                else error("Docker returned an ambiguous pulled image")
                end
              ' <<<"$pulled_metadata")"
              unpacked_bytes="$(jq -er '
                if length == 1
                then .[0].Size | select(type == "number" and . > 0)
                else error("Docker returned an ambiguous pulled image")
                end
              ' <<<"$pulled_metadata")"
              [[ "$unpacked_bytes" =~ ^[0-9]+$ ]]
              if (( unpacked_bytes > unpacked_limit )); then
                echo "${component} linux/${architecture} unpacked size ${unpacked_bytes} exceeds contract limit ${unpacked_limit}" >&2
                exit 1
              fi
              remove_exact_local_image "$image" "$pulled_id"
            done
          done

          verified_images="$GITHUB_WORKSPACE/verified-managed-images.json"
          for component in "${components[@]}"; do
            jq -n --arg key "$component" --arg value "${images[$component]}" '{key:$key,value:$value}'
          done | jq -se --argjson expected "$expected_count" '
            map({(.key): .value}) | add |
            select(length == $expected and all(.[]; test("^[^@\\s]+@sha256:[0-9a-f]{64}$")))
          ' > "$verified_images"
          jq -e --arg stage "$TRANSITION_STAGE" --slurpfile verified "$verified_images" '
            ([.managed_image_capacity_estimates | keys[] |
              select($stage == "bridge" or . != "handoff-fs-helper")]) ==
            ($verified[0] | keys)
          ' docs/contracts/container-platform.json >/dev/null

          jq -e '
            ((.auths // {}) | length) == 0 and
            (has("credsStore") | not) and
            (has("credHelpers") | not)
          ' "$DOCKER_CONFIG/config.json" >/dev/null

      - name: Upload verified managed-image directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-managed-images
          path: verified-managed-images.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  manager-binaries:
    name: Manager linux/${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: manager/go.mod
          cache: true
          cache-dependency-path: manager/go.sum

      - name: Build static manager
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p dist
          output="dist/agent-platform-manager-linux-${GOARCH}"
          CGO_ENABLED=0 GOOS=linux go -C manager build \
            -trimpath \
            -ldflags "-s -w -buildid= -X main.version=${SOURCE_COMMIT}" \
            -o "../$output" \
            '${{ needs.prepare.outputs.manager_command }}'
          test -s "$output"
          (cd dist && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload manager binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manager-${{ matrix.arch }}
          path: |
            dist/agent-platform-manager-linux-${{ matrix.arch }}
            dist/agent-platform-manager-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  manager-systemd-integration:
    name: Manager user-systemd activation gate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: manager/go.mod
          cache: true
          cache-dependency-path: manager/go.sum

      - name: Start the runner user-systemd manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          runtime_dir="/run/user/${uid}"
          bus="unix:path=${runtime_dir}/bus"
          for _ in $(seq 1 30); do
            if XDG_RUNTIME_DIR="$runtime_dir" DBUS_SESSION_BUS_ADDRESS="$bus" \
              systemctl --user show-environment >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          XDG_RUNTIME_DIR="$runtime_dir" DBUS_SESSION_BUS_ADDRESS="$bus" \
            systemctl --user show-environment >/dev/null
          XDG_RUNTIME_DIR="$runtime_dir" DBUS_SESSION_BUS_ADDRESS="$bus" \
            systemd-run --user --quiet --wait --collect --property=Type=oneshot /usr/bin/true
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "DBUS_SESSION_BUS_ADDRESS=$bus"
          } >> "$GITHUB_ENV"

      - name: Verify real Manager restart and watchdog cgroups
        working-directory: manager
        env:
          AGENT_PLATFORM_SYSTEMD_INTEGRATION: "1"
        run: |
          set -euo pipefail
          go test -count=1 -v \
            -run '^Test(RecoverySystemdQuiescenceIntegration|OrdinarySystemdActivationRestartIntegration)$' \
            ./internal/selfupdate

      - name: Verify Bridge persistent helper cgroup
        if: needs.prepare.outputs.transition_stage == 'bridge'
        working-directory: manager
        env:
          AGENT_PLATFORM_SYSTEMD_INTEGRATION: "1"
        run: >-
          go test -count=1 -v
          -run '^TestPersistentHelperUserSystemdIntegration$'
          ./internal/handoffhost

  compose-smoke:
    name: Core Compose smoke test
    needs:
      - prepare
      - images
      - public-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download verified managed-image directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-managed-images
          path: artifacts

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start and probe the core stack
        shell: bash
        env:
          TRANSITION_STAGE: ${{ needs.prepare.outputs.transition_stage }}
        run: |
          set -euo pipefail
          root="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is required}/agent-platform-compose-smoke.XXXXXX")"
          export AGENT_PLATFORM_COMPOSE_PROJECT="agent-platform-release-smoke-${GITHUB_RUN_ID}"
          export AGENT_PLATFORM_CORE_NETWORK="${AGENT_PLATFORM_COMPOSE_PROJECT}-core"
          export AGENT_PLATFORM_DATA_ROOT="$root/state"
          export AGENT_PLATFORM_SECRETS_DIR="$AGENT_PLATFORM_DATA_ROOT/manager/secrets"
          export AGENT_PLATFORM_MANAGER_CONTROL_DIR="$AGENT_PLATFORM_DATA_ROOT/manager/control"
          AGENT_PLATFORM_UID="$(id -u)"
          AGENT_PLATFORM_GID="$(id -g)"
          export AGENT_PLATFORM_UID AGENT_PLATFORM_GID
          export AGENT_PLATFORM_PLATFORM_BIND=127.0.0.1:18080
          export AGENT_PLATFORM_PUBLIC_BASE_URL=http://127.0.0.1:18080
          verified_images=artifacts/verified-managed-images.json
          expected_count=10
          [[ "$TRANSITION_STAGE" == bridge ]] && expected_count=11
          jq -e --argjson expected "$expected_count" '
            length == $expected and
            all(.[]; test("^[^@\\s]+@sha256:[0-9a-f]{64}$"))
          ' "$verified_images" >/dev/null
          AGENT_PLATFORM_PLATFORM_IMAGE="$(jq -er '.platform' "$verified_images")"
          AGENT_PLATFORM_AGENT_RUNTIME_IMAGE="$(jq -er '."agent-runtime"' "$verified_images")"
          AGENT_PLATFORM_CAMOFOX_IMAGE="$(jq -er '.camofox' "$verified_images")"
          AGENT_PLATFORM_AGENT_SANDBOX_IMAGE="$(jq -er '."agent-sandbox"' "$verified_images")"
          AGENT_PLATFORM_SEARXNG_IMAGE="$(jq -er '.searxng' "$verified_images")"
          AGENT_PLATFORM_FIRECRAWL_API_IMAGE="$(jq -er '."firecrawl-api"' "$verified_images")"
          AGENT_PLATFORM_FIRECRAWL_PLAYWRIGHT_IMAGE="$(jq -er '."firecrawl-playwright"' "$verified_images")"
          AGENT_PLATFORM_FIRECRAWL_POSTGRES_IMAGE="$(jq -er '."firecrawl-postgres"' "$verified_images")"
          AGENT_PLATFORM_FIRECRAWL_REDIS_IMAGE="$(jq -er '."firecrawl-redis"' "$verified_images")"
          AGENT_PLATFORM_FIRECRAWL_RABBITMQ_IMAGE="$(jq -er '."firecrawl-rabbitmq"' "$verified_images")"
          handoff_helper_image=""
          if [[ "$TRANSITION_STAGE" == bridge ]]; then
            handoff_helper_image="$(jq -er '."handoff-fs-helper"' "$verified_images")"
          else
            jq -e 'has("handoff-fs-helper") | not' "$verified_images" >/dev/null
          fi
          export \
            AGENT_PLATFORM_PLATFORM_IMAGE AGENT_PLATFORM_AGENT_RUNTIME_IMAGE AGENT_PLATFORM_CAMOFOX_IMAGE \
            AGENT_PLATFORM_AGENT_SANDBOX_IMAGE AGENT_PLATFORM_SEARXNG_IMAGE \
            AGENT_PLATFORM_FIRECRAWL_API_IMAGE AGENT_PLATFORM_FIRECRAWL_PLAYWRIGHT_IMAGE \
            AGENT_PLATFORM_FIRECRAWL_POSTGRES_IMAGE AGENT_PLATFORM_FIRECRAWL_REDIS_IMAGE \
            AGENT_PLATFORM_FIRECRAWL_RABBITMQ_IMAGE
          sandbox_image="$AGENT_PLATFORM_AGENT_SANDBOX_IMAGE"
          sandbox_container="${AGENT_PLATFORM_COMPOSE_PROJECT}-sandbox"
          browser_fixture_container="${AGENT_PLATFORM_COMPOSE_PROJECT}-browser-fixture"
          manager_stub_pid=""
          cleanup() {
            docker rm --force "$sandbox_container" >/dev/null 2>&1 || true
            docker rm --force "$browser_fixture_container" >/dev/null 2>&1 || true
            docker compose -f containers/compose.yaml down --volumes --remove-orphans >/dev/null 2>&1 || true
            docker network rm "$AGENT_PLATFORM_CORE_NETWORK" >/dev/null 2>&1 || true
            if [[ -n "$manager_stub_pid" ]]; then
              kill "$manager_stub_pid" >/dev/null 2>&1 || true
              wait "$manager_stub_pid" 2>/dev/null || true
            fi
            case "$root" in
              "$RUNNER_TEMP"/agent-platform-compose-smoke.*) ;;
              *) echo "Refusing to remove unexpected smoke root: $root" >&2; return 1 ;;
            esac
            sudo -n rm -rf --one-file-system -- "$root"
          }
          trap cleanup EXIT
          mkdir -p \
            "$AGENT_PLATFORM_SECRETS_DIR" "$AGENT_PLATFORM_MANAGER_CONTROL_DIR" \
            "$AGENT_PLATFORM_DATA_ROOT/data/workspaces" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/agent" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/camofox" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/searxng/config" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/searxng/cache"
          for secret in \
            session-secret agent-tool-token agent-runtime-token camofox-access-key manager-token manager-executor-token \
            firecrawl-postgres-password firecrawl-bull-auth-key; do
            openssl rand -hex 32 > "$AGENT_PLATFORM_SECRETS_DIR/$secret"
          done
          cp containers/searxng/settings.yml "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/searxng/config/settings.yml"
          chmod 0700 \
            "$AGENT_PLATFORM_DATA_ROOT/data/workspaces" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/agent" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/camofox" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/searxng/config" \
            "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/searxng/cache"
          chmod 0600 "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/searxng/config/settings.yml"
          python3 - "$AGENT_PLATFORM_MANAGER_CONTROL_DIR/manager.sock" "$AGENT_PLATFORM_SECRETS_DIR/manager-token" <<'PY' &
          import datetime
          import hmac
          import http.server
          import json
          import os
          import socketserver
          import sys
          from pathlib import Path

          socket_path = Path(sys.argv[1])
          token = Path(sys.argv[2]).read_text(encoding="utf-8").strip()

          class ManagerContract(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, format, *args):
                  return

              def send_json(self, status, payload):
                  body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Connection", "close")
                  self.end_headers()
                  self.wfile.write(body)
                  self.close_connection = True

              def do_GET(self):
                  supplied = self.headers.get("Authorization", "")
                  if not hmac.compare_digest(supplied, f"Bearer {token}"):
                      self.send_json(401, {"error": "control authentication failed"})
                      return
                  if self.path != "/v1/status":
                      self.send_json(404, {"error": "not found"})
                      return
                  checked_at = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
                  self.send_json(200, {
                      "generation": 0,
                      "current": None,
                      "previous": None,
                      "target": None,
                      "public_state": "idle",
                      "phase": "",
                      "services": {
                          "manager": {"status": "healthy"},
                          "platform": {"status": "running"},
                      },
                      "error": "",
                      "maintenance": False,
                      "active_operation_id": "",
                      "finalize_pending_operation_id": "",
                      "operation_id": "",
                      "gate_settlement": None,
                      "checked_at": checked_at,
                  })

          class ThreadingUnixHTTPServer(socketserver.ThreadingMixIn, socketserver.UnixStreamServer):
              daemon_threads = True

          server = ThreadingUnixHTTPServer(str(socket_path), ManagerContract)
          os.chmod(socket_path, 0o600)
          server.serve_forever()
          PY
          manager_stub_pid="$!"
          for attempt in $(seq 1 50); do
            [[ -S "$AGENT_PLATFORM_MANAGER_CONTROL_DIR/manager.sock" ]] && break
            kill -0 "$manager_stub_pid"
            sleep 0.1
          done
          test -S "$AGENT_PLATFORM_MANAGER_CONTROL_DIR/manager.sock"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --unix-socket "$AGENT_PLATFORM_MANAGER_CONTROL_DIR/manager.sock" \
            http://manager/v1/status)" = 401
          manager_status="$(curl --fail --silent --show-error \
            --unix-socket "$AGENT_PLATFORM_MANAGER_CONTROL_DIR/manager.sock" \
            --header "Authorization: Bearer $(<"$AGENT_PLATFORM_SECRETS_DIR/manager-token")" \
            http://manager/v1/status)"
          jq -e '
            .public_state == "idle" and
            .maintenance == false and
            .active_operation_id == "" and
            .finalize_pending_operation_id == "" and
            .operation_id == "" and
            .services.manager.status == "healthy"
          ' <<<"$manager_status" >/dev/null
          docker network create \
            --driver bridge \
            --label io.agent-platform.network=core \
            "$AGENT_PLATFORM_CORE_NETWORK"
          docker compose -f containers/compose.yaml config --quiet
          resolved_compose="$(docker compose -f containers/compose.yaml config --format json)"
          jq -e --slurpfile expected "$verified_images" '
            {
              platform: .services.platform.image,
              "agent-runtime": .services["agent-runtime"].image,
              camofox: .services.camofox.image,
              searxng: .services.searxng.image,
              "firecrawl-api": .services["firecrawl-api"].image,
              "firecrawl-playwright": .services["firecrawl-playwright"].image,
              "firecrawl-postgres": .services["firecrawl-postgres"].image,
              "firecrawl-redis": .services["firecrawl-redis"].image,
              "firecrawl-rabbitmq": .services["firecrawl-rabbitmq"].image
            } == ($expected[0] | del(."agent-sandbox", ."handoff-fs-helper"))
          ' <<<"$resolved_compose" >/dev/null
          test "$(docker run --rm --pull=always --network=none --read-only --entrypoint sh \
            "$AGENT_PLATFORM_FIRECRAWL_REDIS_IMAGE" -c 'printf "%s:%s" "$(id -u redis)" "$(id -g redis)"')" = "999:1000"
          test "$(docker run --rm --pull=always --network=none --read-only --entrypoint sh \
            "$AGENT_PLATFORM_FIRECRAWL_RABBITMQ_IMAGE" -c 'printf "%s:%s" "$(id -u rabbitmq)" "$(id -g rabbitmq)"')" = "999:999"
          test "$(docker run --rm --pull=always --network=none --read-only --entrypoint sh \
            "$AGENT_PLATFORM_FIRECRAWL_POSTGRES_IMAGE" -c 'printf "%s:%s" "$(id -u postgres)" "$(id -g postgres)"')" = "999:999"
          if [[ "$TRANSITION_STAGE" == bridge ]]; then
          docker pull "$handoff_helper_image"
          handoff_helper_root="$root/handoff-helper"
          mkdir -p "$handoff_helper_root/source/data" "$handoff_helper_root/target" "$handoff_helper_root/control"
          chmod 0700 "$handoff_helper_root" "$handoff_helper_root/source" "$handoff_helper_root/target" "$handoff_helper_root/control"
          printf 'different uid payload\n' > "$handoff_helper_root/source/data/payload.txt"
          chmod 0700 "$handoff_helper_root/source/data"
          chmod 0600 "$handoff_helper_root/source/data/payload.txt"
          sudo -n chown -R 42424:42424 "$handoff_helper_root/source/data"
          sudo -n python3 - \
            "$handoff_helper_root/source/data" "$handoff_helper_root/control/request.json" \
            "$handoff_helper_image" "$AGENT_PLATFORM_UID" "$AGENT_PLATFORM_GID" <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys

          source, output, image, manager_uid, manager_gid = sys.argv[1:]

          def entry(path, relative):
              observed = os.lstat(path)
              result = {
                  "resource": "different_uid_data",
                  "path": relative,
                  "type": "directory" if stat.S_ISDIR(observed.st_mode) else "file",
                  "mode": stat.S_IMODE(observed.st_mode),
                  "uid": observed.st_uid,
                  "gid": observed.st_gid,
                  "link_count": observed.st_nlink,
                  "size": observed.st_size,
                  "allocated_size": observed.st_blocks * 512,
                  "modified_nanos": observed.st_mtime_ns,
              }
              if stat.S_ISREG(observed.st_mode):
                  result["sha256"] = hashlib.sha256(open(path, "rb").read()).hexdigest()
              return result

          request = {
              "schema_version": 1,
              "operation": "copy",
              "transaction_id": "handoff_11111111111111111111111111111111",
              "data_request_sha256": "a" * 64,
              "resource_name": "different_uid_data",
              "access": "container_owned_tree",
              "image_digest": image,
              "manager_uid": int(manager_uid),
              "manager_gid": int(manager_gid),
              "target_relative": "copied",
              "source_owners": [{"uid": 42424, "gid": 42424}],
              "target_owners": [{"uid": 42424, "gid": 42424}],
              "expected_source": [
                  entry(source, "."),
                  entry(os.path.join(source, "payload.txt"), "payload.txt"),
              ],
              "request_sha256": "",
          }
          canonical = json.dumps(request, ensure_ascii=False, separators=(",", ":")).encode()
          request["request_sha256"] = hashlib.sha256(canonical).hexdigest()
          with open(output, "x", encoding="utf-8") as target:
              json.dump(request, target, ensure_ascii=False, separators=(",", ":"))
              target.write("\n")
              target.flush()
              os.fsync(target.fileno())
          os.chmod(output, 0o600)
          os.chown(output, int(manager_uid), int(manager_gid))
          PY
          docker run --rm --pull=never --network=none --read-only --user=0:0 \
            --cap-drop=ALL --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER \
            --security-opt=no-new-privileges:true --pids-limit=64 \
            --env "HANDOFF_FS_IMAGE_DIGEST=$handoff_helper_image" \
            --mount "type=bind,src=$handoff_helper_root/control,dst=/control" \
            --mount "type=bind,src=$handoff_helper_root/source/data,dst=/source,readonly" \
            --mount "type=bind,src=$handoff_helper_root/target,dst=/target" \
            "$handoff_helper_image" --request /control/request.json --receipt /control/receipt.json
          jq -e --arg image "$handoff_helper_image" '
            .schema_version == 1 and .operation == "copy" and .image_digest == $image and
            .transaction_id == "handoff_11111111111111111111111111111111" and
            (.source_entries | length) == 2 and (.target_entries | length) == 2 and
            (.receipt_sha256 | test("^[0-9a-f]{64}$"))
          ' "$handoff_helper_root/control/receipt.json" >/dev/null
          test "$(sudo -n stat -c '%u:%g:%a' "$handoff_helper_root/target/copied")" = "42424:42424:700"
          test "$(sudo -n stat -c '%u:%g:%a' "$handoff_helper_root/target/copied/payload.txt")" = "42424:42424:600"
          test "$(sudo -n sha256sum "$handoff_helper_root/source/data/payload.txt" | awk '{print $1}')" = \
            "$(sudo -n sha256sum "$handoff_helper_root/target/copied/payload.txt" | awk '{print $1}')"
          fi
          docker compose -f containers/compose.yaml up --detach agent-runtime camofox searxng platform
          for service in agent-runtime camofox searxng platform; do
            container="$(docker compose -f containers/compose.yaml ps -q "$service")"
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              [[ "$status" == healthy ]] && break
              [[ "$status" != unhealthy || "$attempt" -lt 60 ]] || {
                docker compose -f containers/compose.yaml logs "$service"
                exit 1
              }
              sleep 5
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          done
          searxng_container="$(docker compose -f containers/compose.yaml ps -q searxng)"
          docker inspect "$searxng_container" | jq -e \
            --arg source "$AGENT_PLATFORM_DATA_ROOT/data/runtimes/searxng/config" '
              [.[0].Mounts[] | select(.Destination == "/etc/searxng")] as $config |
              ($config | length) == 1 and
              $config[0].Type == "bind" and
              $config[0].Source == $source and
              $config[0].RW == false and
              ([.[0].Mounts[] | select(.Type == "volume")] | length) == 0
            ' >/dev/null
          docker compose -f containers/compose.yaml exec -T searxng sh -eu -c '
            test -r /etc/searxng/settings.yml
            test "$(stat -c %u /etc/searxng/settings.yml)" = "$(id -u)"
          '
          curl --fail --silent --show-error http://127.0.0.1:18080/healthz | jq -e '.service == "agent-platform"'
          browser_fixture_path="$GITHUB_WORKSPACE/scripts/fixtures/browser-control.html"
          test -f "$browser_fixture_path"
          docker run --detach \
            --name "$browser_fixture_container" \
            --network "$AGENT_PLATFORM_CORE_NETWORK" \
            --user "$AGENT_PLATFORM_UID:$AGENT_PLATFORM_GID" \
            --read-only \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --mount "type=bind,src=$browser_fixture_path,dst=/fixture/index.html,readonly" \
            --entrypoint python \
            "$AGENT_PLATFORM_PLATFORM_IMAGE" \
            -m http.server 18081 --bind 0.0.0.0 --directory /fixture
          for attempt in $(seq 1 50); do
            if docker exec "$browser_fixture_container" python -c \
              'import urllib.request; urllib.request.urlopen("http://127.0.0.1:18081/", timeout=1).read(1)'; then
              break
            fi
            [[ "$attempt" -lt 50 ]] || {
              docker logs "$browser_fixture_container"
              exit 1
            }
            sleep 0.2
          done
          python3 scripts/browser-control-compose-smoke.py \
            --platform-url http://127.0.0.1:18080 \
            --bootstrap-password-file "$AGENT_PLATFORM_DATA_ROOT/data/bootstrap-admin-password.txt" \
            --agent-tool-token-file "$AGENT_PLATFORM_SECRETS_DIR/agent-tool-token" \
            --fixture-url "http://${browser_fixture_container}:18081/"
          docker rm --force "$browser_fixture_container"
          sandbox_mount_root="$root/sandbox-uid-mapping"
          mkdir -p "$sandbox_mount_root/workspace" "$sandbox_mount_root/home" "$sandbox_mount_root/env"
          touch "$sandbox_mount_root/workspace/ownership-sentinel"
          sentinel_uid="$(stat -c %u "$sandbox_mount_root/workspace/ownership-sentinel")"
          docker run --rm \
            --env AGENT_PLATFORM_AGENT_UID=12345 \
            --env AGENT_PLATFORM_AGENT_GID=23456 \
            --env "AGENT_PLATFORM_SENTINEL_UID=$sentinel_uid" \
            --mount "type=bind,src=$sandbox_mount_root/workspace,dst=/workspace" \
            --mount "type=bind,src=$sandbox_mount_root/home,dst=/home/agent" \
            --mount "type=bind,src=$sandbox_mount_root/env,dst=/opt/agent-env" \
            "$sandbox_image" \
            sh -eu -c 'test "$(id -u)" = 12345; test "$(id -g)" = 23456; test "$(sudo -n id -u)" = 0; test "$(stat -c %u /workspace/ownership-sentinel)" = "$AGENT_PLATFORM_SENTINEL_UID"; chmod 0755 /workspace /home/agent /opt/agent-env'
          test "$(stat -c %u "$sandbox_mount_root/workspace/ownership-sentinel")" = "$sentinel_uid"
          docker compose -f containers/compose.yaml stop \
            platform agent-runtime camofox searxng
          if ! docker compose -f containers/compose.yaml up --detach --wait --wait-timeout 600 firecrawl-api; then
            docker compose -f containers/compose.yaml ps --all
            docker compose -f containers/compose.yaml logs --no-color --tail 200 \
              firecrawl-api firecrawl-playwright firecrawl-redis firecrawl-rabbitmq \
              firecrawl-postgres
            exit 1
          fi
          for service in \
            firecrawl-playwright firecrawl-redis firecrawl-rabbitmq \
            firecrawl-postgres firecrawl-api; do
            container="$(docker compose -f containers/compose.yaml ps -q "$service")"
            test -n "$container"
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              [[ "$status" == healthy ]] && break
              [[ "$status" != unhealthy || "$attempt" -lt 60 ]] || {
                docker compose -f containers/compose.yaml logs --no-color --tail 200 "$service"
                exit 1
              }
              sleep 5
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          done
          firecrawl_scrape() {
            local phase="$1"
            local attempt
            for attempt in 1 2 3; do
              if docker compose -f containers/compose.yaml exec -T firecrawl-api \
                node --input-type=module - "$phase" <<'NODE'
          const phase = process.argv[2] || 'unknown';
          const response = await fetch('http://127.0.0.1:3002/v1/scrape', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({url: 'https://example.com/', formats: ['markdown']}),
            signal: AbortSignal.timeout(120000),
          });
          const text = await response.text();
          let body;
          try {
            body = JSON.parse(text);
          } catch (error) {
            throw new Error(`Firecrawl ${phase} scrape returned non-JSON: ${response.status} ${text.slice(0, 2000)}`, {cause: error});
          }
          if (!response.ok || body.success !== true || !body.data?.markdown?.includes('Example Domain')) {
            throw new Error(`Firecrawl ${phase} scrape failed: ${response.status} ${text.slice(0, 2000)}`);
          }
          NODE
              then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "Firecrawl ${phase} scrape attempt ${attempt}/3 failed; retrying" >&2
                sleep $((attempt * 5))
              fi
            done
            echo "Firecrawl ${phase} scrape failed after 3 attempts" >&2
            docker compose -f containers/compose.yaml ps --all >&2
            docker compose -f containers/compose.yaml logs --no-color --timestamps --tail 200 \
              firecrawl-api firecrawl-playwright firecrawl-redis firecrawl-rabbitmq \
              firecrawl-postgres >&2
            return 1
          }
          sentinel_key=agent_platform_ci_persistence
          sentinel_value="retained_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          first_postgres="$(docker compose -f containers/compose.yaml ps -q firecrawl-postgres)"
          test -n "$first_postgres"
          docker compose -f containers/compose.yaml exec -T \
            -e "AGENT_PLATFORM_SENTINEL_KEY=$sentinel_key" \
            -e "AGENT_PLATFORM_SENTINEL_VALUE=$sentinel_value" \
            firecrawl-postgres sh -eu -c '
              export PGPASSWORD="$(cat /run/secrets/agent-platform/firecrawl-postgres-password)"
              psql --host 127.0.0.1 --username postgres --dbname postgres \
                --set ON_ERROR_STOP=1 --command "
                  CREATE TABLE IF NOT EXISTS agent_platform_release_smoke (
                    key text PRIMARY KEY,
                    value text NOT NULL
                  );
                  INSERT INTO agent_platform_release_smoke (key, value)
                  VALUES ('"'"'$AGENT_PLATFORM_SENTINEL_KEY'"'"', '"'"'$AGENT_PLATFORM_SENTINEL_VALUE'"'"')
                  ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;
                "
            '
          docker compose -f containers/compose.yaml exec -T firecrawl-api \
            node -e 'fetch("http://127.0.0.1:3002/v0/health/liveness").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
          firecrawl_scrape cold
          docker compose -f containers/compose.yaml rm --stop --force \
            firecrawl-api firecrawl-postgres
          if ! docker compose -f containers/compose.yaml up --detach --wait --wait-timeout 600 firecrawl-api; then
            docker compose -f containers/compose.yaml ps --all
            docker compose -f containers/compose.yaml logs --no-color --tail 200 \
              firecrawl-api firecrawl-playwright firecrawl-redis firecrawl-rabbitmq \
              firecrawl-postgres
            exit 1
          fi
          for service in firecrawl-postgres firecrawl-api; do
            container="$(docker compose -f containers/compose.yaml ps -q "$service")"
            test -n "$container"
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              [[ "$status" == healthy ]] && break
              [[ "$status" != unhealthy || "$attempt" -lt 60 ]] || {
                docker compose -f containers/compose.yaml logs --no-color --tail 200 "$service"
                exit 1
              }
              sleep 5
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          done
          second_postgres="$(docker compose -f containers/compose.yaml ps -q firecrawl-postgres)"
          test -n "$second_postgres"
          test "$second_postgres" != "$first_postgres"
          read_output="$(docker compose -f containers/compose.yaml exec -T \
            -e "AGENT_PLATFORM_SENTINEL_KEY=$sentinel_key" \
            firecrawl-postgres sh -eu -c '
              export PGPASSWORD="$(cat /run/secrets/agent-platform/firecrawl-postgres-password)"
              psql --host 127.0.0.1 --username postgres --dbname postgres \
                --tuples-only --no-align --set ON_ERROR_STOP=1 \
                --command "SELECT value FROM agent_platform_release_smoke WHERE key = '"'"'$AGENT_PLATFORM_SENTINEL_KEY'"'"';"
            ')"
          test "$read_output" = "$sentinel_value"
          docker compose -f containers/compose.yaml exec -T firecrawl-api \
            node -e 'fetch("http://127.0.0.1:3002/v0/health/liveness").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
          firecrawl_scrape warm
          docker compose -f containers/compose.yaml stop \
            firecrawl-api firecrawl-playwright firecrawl-redis firecrawl-rabbitmq \
            firecrawl-postgres
          docker run --detach \
            --name "$sandbox_container" \
            --network "$AGENT_PLATFORM_CORE_NETWORK" \
            --env AGENT_PLATFORM_AGENT_UID=12345 \
            --env AGENT_PLATFORM_AGENT_GID=23456 \
            "$sandbox_image"
          docker exec --user 12345:23456 "$sandbox_container" sh -eu -c \
            'test "$(id -u)" = 12345; test "$(id -g)" = 23456'
          docker compose -f containers/compose.yaml down --remove-orphans
          test "$(docker inspect --format '{{.State.Running}}' "$sandbox_container")" = true
          docker network inspect "$AGENT_PLATFORM_CORE_NETWORK" \
            --format '{{index .Labels "io.agent-platform.network"}}' | grep -Fx core
          docker network inspect "$AGENT_PLATFORM_CORE_NETWORK" \
            --format '{{json .Containers}}' | jq -e --arg id "$(docker inspect --format '{{.Id}}' "$sandbox_container")" 'has($id)'
          docker compose -f containers/compose.yaml up --detach --wait \
            agent-runtime camofox searxng platform
          test "$(docker inspect --format '{{.State.Running}}' "$sandbox_container")" = true

  publish:
    name: Publish atomic main release
    needs:
      - prepare
      - upstream-contracts
      - images
      - manager-binaries
      - manager-systemd-integration
      - compose-smoke
      - public-images
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.upstream-contracts.result == 'success' &&
      needs.images.result == 'success' &&
      needs.manager-binaries.result == 'success' &&
      needs.manager-systemd-integration.result == 'success' &&
      needs.compose-smoke.result == 'success' &&
      needs.public-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: read
    concurrency:
      # The seal/upload critical section is repository-wide.  In particular,
      # two ordinary target generations must never reserve the same public
      # predecessor while promotion is catching up.
      group: container-publish-main
      cancel-in-progress: false
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out publisher policy from the workflow execution head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: .publisher-policy
          persist-credentials: false

      - name: Download verified managed-image directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-managed-images
          path: artifacts

      - name: Download Manager binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: manager-*
          path: artifacts
          merge-multiple: true

      - name: Assemble and validate release manifest
        id: manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          TRANSITION_STAGE: ${{ needs.prepare.outputs.transition_stage }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release"
          mkdir -p "$stage"
          if [[ "$TRANSITION_STAGE" == bridge ]]; then
            manager_prefix=ubitech-manager-linux
            compose_asset=ubitech-compose.yaml
          else
            manager_prefix=agent-platform-manager-linux
            compose_asset=agent-platform-compose.yaml
          fi
          for architecture in amd64 arm64; do
            cp "artifacts/agent-platform-manager-linux-${architecture}" \
              "$stage/${manager_prefix}-${architecture}"
            cp "artifacts/agent-platform-manager-linux-${architecture}.sha256" \
              "$stage/${manager_prefix}-${architecture}.sha256"
            sed -i "s/agent-platform-manager-linux-${architecture}/${manager_prefix}-${architecture}/" \
              "$stage/${manager_prefix}-${architecture}.sha256"
          done
          cp containers/compose.yaml "$stage/$compose_asset"
          cp install.sh "$stage/install.sh"
          chmod 0755 "$stage"/${manager_prefix}-amd64 "$stage"/${manager_prefix}-arm64 "$stage/install.sh"
          bash -n "$stage/install.sh"
          (cd "$stage" && sha256sum install.sh > install.sh.sha256)
          release_tag="container-${SOURCE_COMMIT}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          compose_sha="$(sha256sum "$stage/$compose_asset" | awk '{print $1}')"
          amd64_sha="$(awk 'NR==1 {print $1}' "$stage/${manager_prefix}-amd64.sha256")"
          arm64_sha="$(awk 'NR==1 {print $1}' "$stage/${manager_prefix}-arm64.sha256")"
          generated_at="$(git show -s --format=%cI "$SOURCE_COMMIT")"
          database_schema_version="$(jq -er '.database_schema_version' docs/contracts/container-platform.json)"
          expected_images=10
          [[ "$TRANSITION_STAGE" == bridge ]] && expected_images=11
          jq -ecS --argjson expected "$expected_images" '
            select(length == $expected) |
            with_entries(select(.key | test("^[a-z0-9]+(-[a-z0-9]+)*$"))) |
            select(length == $expected and all(.[]; test("^[^@\\s]+@sha256:[0-9a-f]{64}$")))
          ' artifacts/verified-managed-images.json > "$stage/verified-managed-images.json"
          transition_predecessor="$(jq -er '.predecessor_generation | select(test("^[0-9a-f]{40}$"))' docs/contracts/release-transition.json)"
          current_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          predecessor="$transition_predecessor"
          if [[ "$TRANSITION_STAGE" == target_baseline ]]; then
            if [[ ! "$current_tag" =~ ^container-([0-9a-f]{40})$ ]]; then
              echo "Target baseline latest is not an immutable generation: ${current_tag}" >&2
              exit 1
            fi
            predecessor="${BASH_REMATCH[1]}"
          fi
          predecessor_root="$RUNNER_TEMP/predecessor-release"
          mkdir -p "$predecessor_root"
          predecessor_api="$RUNNER_TEMP/predecessor-release-api.json"
          if [[ "$TRANSITION_STAGE" == cleanup ]]; then
            gh api --paginate -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -se --arg tag "container-${predecessor}" '
                if all(.[]; type == "array") then [.[] | .[] | select(.tag_name == $tag)]
                else error("invalid paginated releases response") end |
                if length == 1 then .[0]
                else error("Cleanup predecessor draft release identity is not unique") end
              ' > "$predecessor_api"
          else
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/container-${predecessor}" \
              > "$predecessor_api"
          fi
          assembler_args=(
            scripts/assemble_release_manifest.py
            --contract docs/contracts/release-transition.json
            --images "$stage/verified-managed-images.json"
            --generation "$SOURCE_COMMIT"
            --generated-at "$generated_at"
            --database-schema-version "$database_schema_version"
            --manager-amd64-url "$release_base/${manager_prefix}-amd64"
            --manager-amd64-sha256 "$amd64_sha"
            --manager-arm64-url "$release_base/${manager_prefix}-arm64"
            --manager-arm64-sha256 "$arm64_sha"
            --compose-url "$release_base/${compose_asset}"
            --compose-sha256 "$compose_sha"
            --output "$stage/release.json"
          )
          if [[ "$TRANSITION_STAGE" == bridge ]]; then
            [[ "$current_tag" == "container-${predecessor}" ]] || {
              echo "Bridge predecessor is no longer the public latest: ${current_tag}" >&2
              exit 1
            }
            jq -e --arg tag "container-${predecessor}" --arg predecessor "$predecessor" '
              .tag_name == $tag and .target_commitish == $predecessor and
              .draft == false and .prerelease == false
            ' "$predecessor_api" >/dev/null
            for asset in release.json ubitech-compose.yaml ubitech-manager-linux-amd64; do
              gh release download "container-${predecessor}" --repo "$GITHUB_REPOSITORY" \
                --dir "$predecessor_root" --pattern "$asset"
            done
            assembler_args+=(--predecessor-manifest "$predecessor_root/release.json")
          elif [[ "$TRANSITION_STAGE" == cleanup ]]; then
            [[ "$current_tag" != "container-${predecessor}" ]] || {
              echo "Cleanup must be prebuilt while its Bridge predecessor remains draft" >&2
              exit 1
            }
            bridge_assets=(
              install.sh install.sh.sha256 promotion.json release.json
              ubitech-compose.yaml ubitech-manager-linux-amd64
              ubitech-manager-linux-amd64.sha256 ubitech-manager-linux-arm64
              ubitech-manager-linux-arm64.sha256
            )
            expected_bridge_assets="$(printf '%s\n' "${bridge_assets[@]}" | jq -R . | jq -sc 'sort')"
            jq -e --arg tag "container-${predecessor}" --arg predecessor "$predecessor" \
              --argjson names "$expected_bridge_assets" '
              .tag_name == $tag and .target_commitish == $predecessor and
              .draft == true and .prerelease == false and
              ([.assets[].name] | sort) == $names and
              ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
              all(.assets[]; (.id | type == "number" and . > 0) and
                .state == "uploaded" and (.size | type == "number" and . > 0) and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))
            ' "$predecessor_api" >/dev/null
            for asset in "${bridge_assets[@]}"; do
              asset_id="$(jq -er --arg name "$asset" \
                '.assets[] | select(.name == $name) | .id | select(type == "number" and . > 0)' \
                "$predecessor_api")"
              gh api -H 'Accept: application/octet-stream' \
                "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "$predecessor_root/$asset"
            done
            for contract_asset in release-transition.json release-transition-challenge.schema.json release-transition-receipt.schema.json; do
              git show "$predecessor:docs/contracts/$contract_asset" > "$predecessor_root/$contract_asset"
            done
            bridge_public_predecessor="$(jq -er '
              select(.stage == "bridge") |
              .predecessor_generation | select(test("^[0-9a-f]{40}$"))
            ' "$predecessor_root/release-transition.json")"
            [[ "$current_tag" == "container-${bridge_public_predecessor}" ]] || {
              echo "Cleanup prebuild requires the Bridge source-owner to remain public latest" >&2
              exit 1
            }
            python3 scripts/release_promotion.py validate-promotion \
              --contract "$predecessor_root/release-transition.json" \
              --manifest "$predecessor_root/release.json" \
              --challenge-schema "$predecessor_root/release-transition-challenge.schema.json" \
              --receipt-schema "$predecessor_root/release-transition-receipt.schema.json" \
              --generation "$predecessor" \
              --assets-root "$predecessor_root" \
              --promotion "$predecessor_root/promotion.json"
            python3 - "$predecessor_root" "$predecessor_api" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          api = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected = {item["name"]: item for item in api["assets"]}
          actual = sorted(path.name for path in root.iterdir() if not path.name.startswith("release-transition"))
          if actual != sorted(expected):
              raise SystemExit(f"Cleanup predecessor release directory mismatch: {actual}")
          for name, item in expected.items():
              path = root / name
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item["digest"] or path.stat().st_size != item["size"]:
                  raise SystemExit(f"Cleanup predecessor asset identity drift: {name}")
          PY
            predecessor_proof_root="$RUNNER_TEMP/cleanup-predecessor-provenance"
            mkdir -p "$predecessor_proof_root"
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" |
              jq -s --arg predecessor "$predecessor" '
                [.[].artifacts[] | select(
                  .expired == false and
                  (.name | test("^release-promotion-provenance-" + $predecessor + "-attempt-[1-9][0-9]*$")) and
                  (.id | type == "number" and . > 0) and
                  (.size_in_bytes | type == "number" and . > 0 and . <= 8388608) and
                  (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                  (.workflow_run.id | type == "number" and . > 0) and
                  (.workflow_run.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                )] | sort_by(.created_at) | reverse
              ' > "$predecessor_proof_root/artifacts.json"
            proof_count=0
            while IFS=$'\t' read -r artifact_id artifact_name artifact_digest artifact_run artifact_head; do
              attempt_root="$predecessor_proof_root/$artifact_id"
              mkdir -p "$attempt_root"
              archive="$attempt_root/provenance.zip"
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive"
              [[ "sha256:$(sha256sum "$archive" | awk '{print $1}')" == "$artifact_digest" ]]
              python3 - "$archive" "$attempt_root/provenance.json" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as value:
              infos = value.infolist()
              if len(infos) != 1 or infos[0].filename != "publisher-provenance.json":
                  raise SystemExit("Cleanup predecessor provenance artifact is not closed")
              mode = infos[0].external_attr >> 16
              if stat.S_ISLNK(mode) or infos[0].file_size <= 0 or infos[0].file_size > 1024 * 1024:
                  raise SystemExit("Cleanup predecessor provenance member is unsafe")
              output.write_bytes(value.read(infos[0]))
          PY
              proof="$attempt_root/provenance.json"
              if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg predecessor "$predecessor" \
                --arg artifact "$artifact_name" '
                .repository == $repo and .workflow_path == ".github/workflows/container-release.yml" and
                (.workflow_event == "workflow_run" or .workflow_event == "workflow_dispatch") and
                .source_commit == $predecessor and .candidate_stage == "bridge" and
                (.workflow_run_id | type == "number" and . > 0) and
                (.run_attempt | type == "number" and . > 0) and
                $artifact == ("release-promotion-provenance-" + $predecessor + "-attempt-" + (.run_attempt | tostring))
              ' "$proof" >/dev/null; then
                continue
              fi
              run_id="$(jq -er .workflow_run_id "$proof")"
              run_attempt="$(jq -er .run_attempt "$proof")"
              [[ "$artifact_run" == "$run_id" ]]
              [[ "$artifact_head" == "$(jq -er .execution_head_sha "$proof")" ]]
              run_api="$attempt_root/run.json"
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$run_api"
              jq -e --arg repo "$GITHUB_REPOSITORY" --argjson run "$run_id" \
                --argjson attempt "$run_attempt" --arg execution "$(jq -er .execution_head_sha "$proof")" '
                .id == $run and .run_attempt == $attempt and
                .path == ".github/workflows/container-release.yml" and .conclusion == "success" and
                (.event == "workflow_run" or .event == "workflow_dispatch") and
                .head_branch == "main" and .head_sha == $execution and
                .head_repository.full_name == $repo
              ' "$run_api" >/dev/null
              gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}/jobs?per_page=100" |
                jq -se --arg execution "$(jq -er .execution_head_sha "$proof")" '
                  [.[].jobs[] | select(.name == "Publish atomic main release" and
                    .status == "completed" and .conclusion == "success" and .head_sha == $execution)] |
                  length == 1
                ' >/dev/null
              jq -cS '{
                release_id: .id, tag_name, target_commitish, draft, prerelease,
                assets: ([.assets[] | {id, name, digest, size, state}] | sort_by(.name))
              }' "$predecessor_api" > "$attempt_root/release-identity.json"
              jq -cS .release "$proof" > "$attempt_root/proof-release-identity.json"
              cmp "$attempt_root/release-identity.json" "$attempt_root/proof-release-identity.json"
              jq -cS .source_selection "$proof" > "$attempt_root/source-selection.json"
              quality_run_id="$(jq -er '.source_selection.qualification_run_id | select(type == "number" and . > 0)' "$proof")"
              quality_attempt="$(jq -er '.source_selection.qualification_run_attempt | select(type == "number" and . > 0)' "$proof")"
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${quality_run_id}" > "$attempt_root/quality-run.json"
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg predecessor "$predecessor" \
                --argjson run "$quality_run_id" --argjson attempt "$quality_attempt" '
                .id == $run and .run_attempt == $attempt and
                .path == ".github/workflows/quality.yml" and .event == "push" and
                .conclusion == "success" and .head_branch == "main" and
                .head_sha == $predecessor and .head_repository.full_name == $repo
              ' "$attempt_root/quality-run.json" >/dev/null
              python3 scripts/release_promotion.py validate-publisher-provenance \
                --repository "$GITHUB_REPOSITORY" \
                --workflow-event "$(jq -er .workflow_event "$proof")" \
                --workflow-run-id "$run_id" \
                --run-attempt "$run_attempt" \
                --execution-head-sha "$(jq -er .execution_head_sha "$proof")" \
                --source-commit "$predecessor" \
                --source-selection "$attempt_root/source-selection.json" \
                --release-identity "$attempt_root/release-identity.json" \
                --candidate-stage bridge \
                --provenance "$proof"
              proof_count=$((proof_count + 1))
              break
            done < <(jq -r '.[] | [.id, .name, .digest, .workflow_run.id, .workflow_run.head_sha] | @tsv' "$predecessor_proof_root/artifacts.json")
            [[ "$proof_count" -eq 1 ]] || {
              echo "Cleanup predecessor has no exact successful sealed publisher provenance" >&2
              exit 1
            }
          elif [[ "$TRANSITION_STAGE" == target_baseline ]]; then
            [[ "$current_tag" == "container-${predecessor}" ]] || {
              echo "Target baseline predecessor is no longer the public latest: ${current_tag}" >&2
              exit 1
            }
            jq -e --arg tag "container-${predecessor}" --arg predecessor "$predecessor" '
              .tag_name == $tag and .target_commitish == $predecessor and
              .draft == false and .prerelease == false
            ' "$predecessor_api" >/dev/null
            for asset in promotion.json release.json; do
              gh release download "container-${predecessor}" --repo "$GITHUB_REPOSITORY" \
                --dir "$predecessor_root" --pattern "$asset"
            done
            for contract_asset in release-transition.json release-transition-challenge.schema.json release-transition-receipt.schema.json; do
              git show "$predecessor:docs/contracts/$contract_asset" > "$predecessor_root/$contract_asset"
            done
            predecessor_stage="$(jq -er '.stage | select(. == "cleanup" or . == "target_baseline")' \
              "$predecessor_root/promotion.json")"
            python3 scripts/release_promotion.py validate-promotion \
              --contract "$predecessor_root/release-transition.json" \
              --manifest "$predecessor_root/release.json" \
              --challenge-schema "$predecessor_root/release-transition-challenge.schema.json" \
              --receipt-schema "$predecessor_root/release-transition-receipt.schema.json" \
              --generation "$predecessor" \
              --promotion "$predecessor_root/promotion.json"
            [[ "$predecessor_stage" == cleanup || "$predecessor_stage" == target_baseline ]]
          else
            echo "Unsupported transition stage: $TRANSITION_STAGE" >&2
            exit 1
          fi
          slot_root="$RUNNER_TEMP/publication-slot"
          mkdir -p "$slot_root"
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -s '
              if all(.[]; type == "array") then add
              else error("invalid paginated releases response") end
            ' > "$RUNNER_TEMP/publication-slot-releases.json"
          jq -c '.[] | select(
              .draft == true and
              (.tag_name | test("^container-[0-9a-f]{40}$")) and
              ([.assets[].name] | index("promotion.json") != null)
            ) | {tag_name, target_commitish, draft}' \
            "$RUNNER_TEMP/publication-slot-releases.json" |
          while IFS= read -r metadata; do
            tag="$(jq -er .tag_name <<<"$metadata")"
            generation="${tag#container-}"
            root="$slot_root/$generation"
            mkdir -p "$root"
            jq -cS . <<<"$metadata" > "$root/metadata.json"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --dir "$root" --pattern promotion.json
          done
          python3 scripts/release_promotion.py ensure-publication-slot \
            --current-generation "$predecessor" \
            --candidate-generation "$SOURCE_COMMIT" \
            --candidate-stage "$TRANSITION_STAGE" \
            --candidates-root "$slot_root"
          python3 "${assembler_args[@]}"
          rm "$stage/verified-managed-images.json"
          promotion_args=(
            scripts/release_promotion.py create-promotion
            --contract docs/contracts/release-transition.json
            --manifest "$stage/release.json"
            --challenge-schema docs/contracts/release-transition-challenge.schema.json
            --receipt-schema docs/contracts/release-transition-receipt.schema.json
            --generation "$SOURCE_COMMIT"
            --assets-root "$stage"
            --output "$stage/promotion.json"
          )
          if [[ "$TRANSITION_STAGE" == target_baseline ]]; then
            promotion_args+=(--predecessor-generation "$predecessor")
          fi
          python3 "${promotion_args[@]}"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish complete release as one visible generation
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          STAGE: ${{ steps.manifest.outputs.stage }}
          RELEASE_TAG: ${{ steps.manifest.outputs.release_tag }}
          EXECUTION_HEAD_SHA: ${{ github.sha }}
          UPSTREAM_QUALITY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          UPSTREAM_QUALITY_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || '' }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
          CANDIDATE_STAGE: ${{ needs.prepare.outputs.transition_stage }}
        run: |
          set -euo pipefail
          sealed_assets=(
            install.sh
            install.sh.sha256
            release.json
          )
          if [[ "$CANDIDATE_STAGE" == bridge ]]; then
            sealed_assets+=(
              ubitech-manager-linux-amd64 ubitech-manager-linux-amd64.sha256
              ubitech-manager-linux-arm64 ubitech-manager-linux-arm64.sha256
              ubitech-compose.yaml
            )
          else
            sealed_assets+=(
              agent-platform-manager-linux-amd64 agent-platform-manager-linux-amd64.sha256
              agent-platform-manager-linux-arm64 agent-platform-manager-linux-arm64.sha256
              agent-platform-compose.yaml
            )
          fi
          assets=("${sealed_assets[@]}" promotion.json)
          expected_names="$(printf '%s\n' "${assets[@]}" | jq -R . | jq -sc 'sort')"
          local_identity="$RUNNER_TEMP/local-release-assets.json"
          python3 - "$STAGE" "$local_identity" "${assets[@]}" <<'PY'
          import hashlib
          import json
          import pathlib
          import stat
          import sys

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          expected = sorted(sys.argv[3:])
          actual = sorted(path.name for path in root.iterdir())
          if actual != expected:
              raise SystemExit(f"local release directory mismatch: {actual}")
          assets = []
          for name in expected:
              path = root / name
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or path.is_symlink() or info.st_size <= 0:
                  raise SystemExit(f"local release asset is not a non-empty regular file: {name}")
              assets.append({
                  "name": name,
                  "digest": "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": info.st_size,
              })
          output.write_text(
              json.dumps(assets, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python3 scripts/release_promotion.py validate-promotion \
            --contract docs/contracts/release-transition.json \
            --manifest "$STAGE/release.json" \
            --challenge-schema docs/contracts/release-transition-challenge.schema.json \
            --receipt-schema docs/contracts/release-transition-receipt.schema.json \
            --generation "$SOURCE_COMMIT" \
            --assets-root "$STAGE" \
            --promotion "$STAGE/promotion.json"

          fetch_release() {
            local output="$1"
            local api_url
            api_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq .apiUrl)"
            [[ "$api_url" == "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/"* ]]
            gh api -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$api_url" > "${output}.tmp"
            mv "${output}.tmp" "$output"
          }

          validate_asset_metadata() {
            local document="$1"
            local require_complete="$2"
            jq -e --arg tag "$RELEASE_TAG" --arg target "$SOURCE_COMMIT" \
              --argjson names "$expected_names" --argjson complete "$require_complete" '
              .tag_name == $tag and
              .target_commitish == $target and
              .prerelease == false and
              (.draft | type == "boolean") and
              (.id | type == "number") and
              (.assets | type == "array") and
              ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
              ([.assets[].name] - $names | length) == 0 and
              (if $complete then ([.assets[].name] | sort) == $names else true end) and
              all(.assets[];
                (.id | type == "number") and .state == "uploaded" and
                (.name | type == "string") and
                (.size | type == "number" and . > 0) and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$document" >/dev/null
          }

          verify_complete_release() {
            local document="$1"
            local api_identity="$2"
            validate_asset_metadata "$document" true
            jq -cS '[.assets[] | {name, digest, size}] | sort_by(.name)' \
              "$document" > "$RUNNER_TEMP/api-release-assets.json"
            cmp "$local_identity" "$RUNNER_TEMP/api-release-assets.json"
            jq -cS '{
              release_id: .id,
              tag_name,
              target_commitish,
              draft,
              prerelease,
              assets: ([.assets[] | {id, name, digest, size, state}] | sort_by(.name))
            }' "$document" > "$api_identity"
          }

          release_json="$RUNNER_TEMP/release-api.json"
          release_complete=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            fetch_release "$release_json"
            validate_asset_metadata "$release_json" false
            is_draft="$(jq -r 'if (.draft | type) == "boolean" then .draft else error("invalid draft state") end' "$release_json")"
            mkdir -p "$RUNNER_TEMP/existing"
            mapfile -t existing_assets < <(jq -er '.assets[].name' "$release_json")
            declare -A existing=()
            for asset in "${existing_assets[@]}"; do
              existing["$asset"]=1
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --dir "$RUNNER_TEMP/existing" --pattern "$asset"
              cmp "$STAGE/$asset" "$RUNNER_TEMP/existing/$asset"
            done
            if [[ -n "${existing[promotion.json]:-}" ]]; then
              verify_complete_release "$release_json" "$RUNNER_TEMP/published-release-identity.json"
              (cd "$RUNNER_TEMP/existing" && bash -n install.sh)
              release_complete=true
            fi
            if [[ "$release_complete" != true && "$is_draft" != true ]]; then
              echo "Incomplete immutable release is already public" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" \
              --title "Agent Platform ${SOURCE_COMMIT:0:12}" \
              --notes "Immutable Docker release for ${SOURCE_COMMIT}." \
              --draft
            declare -A existing=()
          fi
          if [[ "$release_complete" != true ]]; then
            # Fill an interrupted draft without replacing any existing byte.
            # promotion.json is uploaded last and seals the immutable directory.
            for asset in "${sealed_assets[@]}"; do
              if [[ -z "${existing[$asset]:-}" ]]; then
                gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$STAGE/$asset"
              fi
            done
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$STAGE/promotion.json"
          fi
          fetch_release "$release_json"
          verify_complete_release "$release_json" "$RUNNER_TEMP/published-release-identity.json"
          source_selection="$RUNNER_TEMP/publisher-source-selection.json"
          quality_run="$RUNNER_TEMP/publisher-quality-run.json"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ "$UPSTREAM_QUALITY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$UPSTREAM_QUALITY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_QUALITY_RUN_ID}" > "$quality_run"
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg source "$SOURCE_COMMIT" \
              --argjson run "$UPSTREAM_QUALITY_RUN_ID" --argjson attempt "$UPSTREAM_QUALITY_RUN_ATTEMPT" '
              .id == $run and .run_attempt == $attempt and
              .path == ".github/workflows/quality.yml" and
              .event == "push" and .conclusion == "success" and
              .head_branch == "main" and .head_sha == $source and
              .head_repository.full_name == $repo
            ' "$quality_run" >/dev/null
            selection_kind=workflow_run
            selection_resolution=qualified_workflow_run.head_sha
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ -n "$REQUESTED_REF" ]]
            quality_runs="$RUNNER_TEMP/publisher-quality-runs.json"
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?head_sha=${SOURCE_COMMIT}&event=push&status=completed&per_page=100" |
              jq -s '
                if all(.[]; type == "object" and (.workflow_runs | type == "array"))
                then {workflow_runs: [.[].workflow_runs[]]}
                else error("invalid paginated quality workflow runs response")
                end
              ' > "$quality_runs"
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg source "$SOURCE_COMMIT" '
              [.workflow_runs[] | select(
                .path == ".github/workflows/quality.yml" and
                .event == "push" and .conclusion == "success" and
                .head_branch == "main" and .head_sha == $source and
                .head_repository.full_name == $repo and
                (.id | type == "number" and . > 0) and
                (.run_attempt | type == "number" and . > 0)
              )] | sort_by(.id) | last // error("no exact successful Quality run")
            ' "$quality_runs" > "$quality_run"
            selection_kind=workflow_dispatch
            selection_resolution='checkout(inputs.ref).git_rev_parse_head'
          else
            echo "Unsupported publisher event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          jq -cS --arg kind "$selection_kind" --arg resolution "$selection_resolution" \
            --arg requested_ref "$REQUESTED_REF" '
            {
              kind: $kind,
              resolution: $resolution,
              requested_ref: (if $kind == "workflow_run" then null else $requested_ref end),
              qualification_run_id: .id,
              qualification_run_attempt: .run_attempt,
              qualification_workflow_path: .path,
              qualification_event: .event,
              qualification_conclusion: .conclusion,
              qualification_head_branch: .head_branch,
              qualification_head_sha: .head_sha,
              qualification_head_repository: .head_repository.full_name
            }
          ' "$quality_run" > "$source_selection"
          proof="$RUNNER_TEMP/publisher-provenance.json"
          provenance_args=(
            .publisher-policy/scripts/release_promotion.py create-publisher-provenance
            --repository "$GITHUB_REPOSITORY"
            --workflow-event "$GITHUB_EVENT_NAME"
            --workflow-run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --execution-head-sha "$EXECUTION_HEAD_SHA"
            --source-commit "$SOURCE_COMMIT"
            --source-selection "$source_selection"
            --release-identity "$RUNNER_TEMP/published-release-identity.json"
            --candidate-stage "$CANDIDATE_STAGE"
            --output "$proof"
          )
          python3 "${provenance_args[@]}"
          echo "publisher_provenance=$proof" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-promotion-provenance-${{ needs.prepare.outputs.source_commit }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.publish.outputs.publisher_provenance }}
          if-no-files-found: error
          retention-days: 90
