<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Platform browser control smoke</title>
    <style>
      html, body { margin: 0; min-height: 3200px; background: #f5f7fb; color: #172033; }
      #human-control-input {
        position: fixed;
        inset: 24px auto auto 24px;
        z-index: 2;
        box-sizing: border-box;
        width: 520px;
        height: 80px;
        padding: 16px;
        border: 3px solid #4d6aa8;
        border-radius: 12px;
        background: white;
        font: 20px sans-serif;
      }
      #human-control-state {
        position: fixed;
        inset: 124px auto auto 24px;
        z-index: 2;
        padding: 12px 16px;
        background: white;
        font: 18px monospace;
      }
      #drag-track {
        position: fixed;
        inset: 190px auto auto 24px;
        width: 520px;
        height: 56px;
        border: 2px solid #7890be;
        border-radius: 28px;
        background: #dfe7f6;
        touch-action: none;
      }
      #drag-handle {
        position: absolute;
        inset: 4px auto auto 4px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #294d91;
      }
    </style>
  </head>
  <body>
    <input id="human-control-input" aria-label="Human control input" autocomplete="off">
    <output id="human-control-state" role="status"></output>
    <div id="drag-track" aria-label="Human control drag track">
      <div id="drag-handle"></div>
    </div>
    <script>
      const input = document.getElementById("human-control-input");
      const output = document.getElementById("human-control-state");
      const track = document.getElementById("drag-track");
      const handle = document.getElementById("drag-handle");
      const state = { focus: 0, text: "empty", key: "none", scroll: 0, drag: 0, dragCount: 0, pointerDown: 0 };
      const render = () => {
        output.textContent = `human-control-state focus=${state.focus};text=${state.text};key=${state.key};scroll=${state.scroll};drag=${state.drag};drag_count=${state.dragCount};pointer_down=${state.pointerDown}`;
      };
      input.addEventListener("focus", () => { state.focus = 1; render(); });
      input.addEventListener("input", () => { state.text = input.value || "empty"; render(); });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          state.key = "Enter";
          render();
        }
      });
      window.addEventListener("scroll", () => {
        state.scroll = window.scrollY > 0 ? 1 : 0;
        render();
      }, { passive: true });
      let dragging = false;
      const moveHandle = (clientX) => {
        const bounds = track.getBoundingClientRect();
        const left = Math.max(4, Math.min(bounds.width - 52, clientX - bounds.left - 24));
        handle.style.left = `${left}px`;
        return left;
      };
      handle.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        dragging = true;
        state.pointerDown = 1;
        handle.setPointerCapture(event.pointerId);
        moveHandle(event.clientX);
        render();
      });
      handle.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        moveHandle(event.clientX);
      });
      const finishDrag = (event) => {
        if (!dragging) return;
        const left = moveHandle(event.clientX);
        dragging = false;
        state.pointerDown = 0;
        if (left >= 430) {
          state.drag = 1;
          state.dragCount += 1;
        }
        render();
      };
      handle.addEventListener("pointerup", finishDrag);
      handle.addEventListener("pointercancel", (event) => {
        if (!dragging) return;
        dragging = false;
        state.pointerDown = 0;
        render();
      });
      render();
    </script>
  </body>
</html>
