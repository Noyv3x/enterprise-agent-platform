<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Platform browser control smoke</title>
    <style>
      html, body { margin: 0; min-height: 3200px; background: #f5f7fb; color: #172033; }
      #human-control-input {
        position: fixed;
        inset: 24px auto auto 24px;
        z-index: 2;
        box-sizing: border-box;
        width: 520px;
        height: 80px;
        padding: 16px;
        border: 3px solid #4d6aa8;
        border-radius: 12px;
        background: white;
        font: 20px sans-serif;
      }
      #human-control-state {
        position: fixed;
        inset: 124px auto auto 24px;
        z-index: 2;
        padding: 12px 16px;
        background: white;
        font: 18px monospace;
      }
    </style>
  </head>
  <body>
    <input id="human-control-input" aria-label="Human control input" autocomplete="off">
    <output id="human-control-state" role="status"></output>
    <script>
      const input = document.getElementById("human-control-input");
      const output = document.getElementById("human-control-state");
      const state = { focus: 0, text: "empty", key: "none", scroll: 0 };
      const render = () => {
        output.textContent = `human-control-state focus=${state.focus};text=${state.text};key=${state.key};scroll=${state.scroll}`;
      };
      input.addEventListener("focus", () => { state.focus = 1; render(); });
      input.addEventListener("input", () => { state.text = input.value || "empty"; render(); });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          state.key = "Enter";
          render();
        }
      });
      window.addEventListener("scroll", () => {
        state.scroll = window.scrollY > 0 ? 1 : 0;
        render();
      }, { passive: true });
      render();
    </script>
  </body>
</html>
