<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示标题</title>
<style>
/* === THEME ===  Replace palette/fonts per references/style-presets.md. No web fonts: artifacts have no external network. */
:root {
  --stage-bg: #0b0d12; --slide-bg: #14171f;
  --text-primary: #f4f1ea; --text-secondary: #a9a79f; --accent: #ff5722;
  --font-sans: "PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --title-size: 112px; --subtitle-size: 40px; --body-size: 34px; --small-size: 26px; /* never below 24px on the 1920x1080 stage */
  --slide-padding: 120px; --content-gap: 40px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

/* === BASE STAGE (verbatim from assets/viewport-base.css) === */
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}


/* === TYPOGRAPHY / LAYOUT === */
.deck-stage { font-family: var(--font-sans); color: var(--text-primary); }
.slide { padding: var(--slide-padding); display: flex; flex-direction: column; justify-content: center; gap: var(--content-gap); }
.slide h1 { font-size: var(--title-size); line-height: 1.2; font-weight: 900; }
.slide h2 { font-size: 72px; line-height: 1.25; font-weight: 800; }
.slide p, .slide li { font-size: var(--body-size); line-height: 1.6; color: var(--text-secondary); }
.slide .kicker { font-size: var(--small-size); color: var(--accent); letter-spacing: .04em; font-weight: 700; }
.slide ul { list-style: none; display: grid; gap: 20px; }
.slide li::before { content: ""; display: inline-block; width: 14px; height: 14px; background: var(--accent); margin-right: 20px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--content-gap); }
.card { background: #1e222d; border-radius: 16px; padding: 40px; }
.card .num { font-size: 96px; font-weight: 900; color: var(--accent); line-height: 1.1; }
.card p { margin-top: 12px; }

/* === REVEAL ANIMATION (triggered by .visible on the active slide) === */
.reveal { opacity: 0; transform: translateY(30px); transition: opacity .6s var(--ease-out-expo), transform .6s var(--ease-out-expo); }
.slide.visible .reveal { opacity: 1; transform: none; }
.reveal:nth-child(2) { transition-delay: .1s; } .reveal:nth-child(3) { transition-delay: .2s; } .reveal:nth-child(4) { transition-delay: .3s; }

/* === DECK CHROME (outside the stage design system) === */
.deck-controls { display: flex; gap: 12px; align-items: center; color: var(--text-secondary); font: 14px/1 var(--font-sans); background: rgba(0,0,0,.45); padding: 8px 14px; border-radius: 999px; }
.deck-controls button { min-width: 44px; min-height: 44px; border: 0; border-radius: 999px; background: transparent; color: inherit; font-size: 18px; cursor: pointer; }
.deck-controls button:focus-visible { outline: 2px solid var(--accent); }

/* === OVERVIEW MODE (open the file with #all: every slide as a thumbnail, for review screenshots) === */
html.overview, html.overview body { overflow: auto; height: auto; }
html.overview .deck-viewport { position: static; }
html.overview .deck-stage { position: static; width: auto; height: auto; transform: none !important; display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; overflow: visible; background: none; }
html.overview .slide { position: relative; flex: none; visibility: visible; opacity: 1; pointer-events: none; transform: scale(var(--ov, .3)); transform-origin: 0 0;
  margin-right: calc(1920px * (var(--ov, .3) - 1)); margin-bottom: calc(1080px * (var(--ov, .3) - 1)); }
html.overview .reveal { opacity: 1; transform: none; transition: none; }
html.overview .deck-controls { display: none; }
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide active" aria-label="封面">
      <p class="kicker reveal">2026 年度经营复盘</p>
      <h1 class="reveal">把增长做成可复制的系统</h1>
      <p class="reveal">华东事业部 · 2026-10-13</p>
    </section>

    <section class="slide" aria-label="要点">
      <h2 class="reveal">三个结论</h2>
      <div class="cards">
        <div class="card reveal"><div class="num">01</div><p>复购率提升 12 个百分点,来自会员分层运营。</p></div>
        <div class="card reveal"><div class="num">02</div><p>获客成本下降 18%,渠道结构向私域倾斜。</p></div>
        <div class="card reveal"><div class="num">03</div><p>交付周期缩短到 9 天,瓶颈在质检环节。</p></div>
      </div>
    </section>

    <section class="slide" aria-label="下一步">
      <h2 class="reveal">下一步行动</h2>
      <ul class="reveal"><li>Q4 完成质检流程自动化试点</li><li>把会员分层方法推广到另外两个城市</li><li>每月复盘一次,指标写进经营看板</li></ul>
    </section>
  </main>
</div>

<nav class="deck-controls" aria-label="幻灯片导航">
  <button id="prev" aria-label="上一页">‹</button><span id="count">1 / 1</span><button id="next" aria-label="下一页">›</button>
</nav>

<script>
/* === CONTROLLER: stage scaling, keyboard/touch/wheel nav, #N deep link, #all overview === */
(() => {
  const stage = document.getElementById('deckStage');
  const slides = [...stage.querySelectorAll('.slide')];
  const count = document.getElementById('count');
  let index = 0;

  const fit = () => {
    if (document.documentElement.classList.contains('overview')) {
      document.documentElement.style.setProperty('--ov', ((innerWidth - 24 * 4 - 16) / 3 / 1920).toFixed(4));
      return;
    }
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
  };
  const show = (i) => {
    index = Math.max(0, Math.min(i, slides.length - 1));
    slides.forEach((s, n) => { s.classList.toggle('active', n === index); s.classList.toggle('visible', n === index); });
    count.textContent = `${index + 1} / ${slides.length}`;
    if (!document.documentElement.classList.contains('overview')) history.replaceState(null, '', '#' + (index + 1));
  };
  const route = () => {
    const h = location.hash.slice(1);
    document.documentElement.classList.toggle('overview', h === 'all');
    fit();
    if (/^\d+$/.test(h)) show(parseInt(h, 10) - 1); else if (h !== 'all') show(index);
  };

  document.getElementById('prev').onclick = () => show(index - 1);
  document.getElementById('next').onclick = () => show(index + 1);
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(index + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); show(index - 1); }
    else if (e.key === 'Home') show(0); else if (e.key === 'End') show(slides.length - 1);
  });
  let wheelAt = 0;
  addEventListener('wheel', (e) => { if (document.documentElement.classList.contains('overview') || Date.now() - wheelAt < 500) return; wheelAt = Date.now(); show(index + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
  let x0 = null;
  addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(index + (dx < 0 ? 1 : -1)); x0 = null; });
  addEventListener('resize', fit);
  addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
