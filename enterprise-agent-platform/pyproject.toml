[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Web platform for shared and private configurable Agent instances with a platform-owned runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agent Platform contributors" }]
license = { text = "MIT" }
dependencies = [
  "starlette==1.7.0",
  "uvicorn==0.35.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "croniter==6.0.0",
  "markdownify==1.2.0",
  "Pillow==12.3.0",
  "pypdf==6.19.0",
]

[project.scripts]
enterprise-agent-platform = "enterprise_agent_platform.__main__:main"

[tool.setuptools.packages.find]
include = ["enterprise_agent_platform*"]

[tool.setuptools.package-data]
enterprise_agent_platform = [
  "static/**/*",
  "static/*",
]

