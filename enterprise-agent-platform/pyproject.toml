[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Web platform for shared and private configurable Agent instances with a platform-owned runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agent Platform contributors" }]
license = { text = "MIT" }
dependencies = [
  "Pillow>=10.4.0,<13",
  "pypdf>=6.0.0,<7",
]

[project.scripts]
enterprise-agent-platform = "enterprise_agent_platform.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enterprise_agent_platform*"]
namespaces = true

[tool.setuptools.package-data]
enterprise_agent_platform = [
  "static/*",
  "bundled_skills/**/*",
]

[tool.setuptools.exclude-package-data]
enterprise_agent_platform = [
  "bundled_skills/**/__pycache__/*",
  "bundled_skills/**/*.pyc",
  "bundled_skills/**/*.pyo",
]
