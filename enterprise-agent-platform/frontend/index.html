<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Cascade layer order (see src/app.css), declared before any stylesheet so a runtime-registered layer can never
         come first: Tailwind theme and preflight < Tailwind utilities; Beautiful UI component CSS is unlayered, as upstream. -->
    <style>@layer properties, theme, base, components, utilities;</style>
    <title>Agent Platform</title>
    <meta name="description" content="Agent Platform - 公共频道、个人 AI 与运行时管理。" />
    <meta name="color-scheme" content="light dark" />
    <!-- Beautiful UI canvas (--canvas), light and dark -->
    <meta name="theme-color" content="#f1f2f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1d1f" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2124'/%3E%3Cpath d='M16 7c.6 5.4 3.6 8.4 9 9-5.4.6-8.4 3.6-9 9-.6-5.4-3.6-8.4-9-9 5.4-.6 8.4-3.6 9-9Z' fill='%23fafafb'/%3E%3C/svg%3E"
    />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="react-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
