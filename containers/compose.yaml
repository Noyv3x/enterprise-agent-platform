name: ${AGENT_PLATFORM_COMPOSE_PROJECT:-agent-platform}

x-agent-platform-logging: &agent-platform-logging
  driver: json-file
  options:
    max-size: ${AGENT_PLATFORM_LOG_MAX_SIZE:-20m}
    max-file: ${AGENT_PLATFORM_LOG_MAX_FILES:-5}
    compress: "true"

x-agent-platform-service: &agent-platform-service
  init: true
  restart: unless-stopped
  networks:
    - core
  logging: *agent-platform-logging
  security_opt:
    - no-new-privileges:true
  labels:
    io.agent-platform.profile: agent-platform-v1

services:
  platform:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_PLATFORM_IMAGE:?AGENT_PLATFORM_PLATFORM_IMAGE must be an immutable digest reference}
    user: 0:0
    init: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    stop_grace_period: 45s
    environment:
      AGENT_PLATFORM_TECHNICAL_PROFILE: agent-platform-v1
      AGENT_PLATFORM_DATA: /var/lib/agent-platform
      AGENT_PLATFORM_HOST_DATA_ROOT: ${AGENT_PLATFORM_DATA_ROOT:?AGENT_PLATFORM_DATA_ROOT must be set}
      AGENT_PLATFORM_HOST: 0.0.0.0
      AGENT_PLATFORM_PORT: "8765"
      AGENT_PLATFORM_DEPLOYMENT_MODE: container
      AGENT_PLATFORM_RUN_UID: ${AGENT_PLATFORM_UID:-1000}
      AGENT_PLATFORM_RUN_GID: ${AGENT_PLATFORM_GID:-1000}
      AGENT_PLATFORM_PUBLIC_BASE_URL: ${AGENT_PLATFORM_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      AGENT_PLATFORM_TRUSTED_PROXY: "1"
      AGENT_PLATFORM_AGENT_RUNTIME_URL: http://agent-runtime:8766
      AGENT_PLATFORM_CAMOFOX_URL: http://camofox:9377
      AGENT_PLATFORM_SEARXNG_API_URL: http://searxng:8080
      AGENT_PLATFORM_SESSION_SECRET_FILE: /run/secrets/agent-platform/session-secret
      AGENT_PLATFORM_AGENT_TOOL_TOKEN_FILE: /run/secrets/agent-platform/agent-tool-token
      AGENT_PLATFORM_AGENT_RUNTIME_TOKEN_FILE: /run/secrets/agent-platform/agent-runtime-token
      AGENT_PLATFORM_CAMOFOX_ACCESS_KEY_FILE: /run/secrets/agent-platform/camofox-access-key
      AGENT_PLATFORM_MANAGER_SOCKET: /run/agent-platform-manager/manager.sock
      AGENT_PLATFORM_MANAGER_TOKEN_FILE: /run/secrets/agent-platform/manager-token
      AGENT_PLATFORM_MANAGER_EXECUTOR_TOKEN_FILE: /run/secrets/agent-platform/manager-executor-token
    ports:
      - ${AGENT_PLATFORM_PLATFORM_BIND:-127.0.0.1:18080}:8765
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT:?AGENT_PLATFORM_DATA_ROOT must be set}/data:/var/lib/agent-platform
      - ${AGENT_PLATFORM_SECRETS_DIR:?AGENT_PLATFORM_SECRETS_DIR must be set}/session-secret:/run/secrets/agent-platform/session-secret:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/agent-tool-token:/run/secrets/agent-platform/agent-tool-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/agent-runtime-token:/run/secrets/agent-platform/agent-runtime-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/camofox-access-key:/run/secrets/agent-platform/camofox-access-key:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/manager-token:/run/secrets/agent-platform/manager-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/manager-executor-token:/run/secrets/agent-platform/manager-executor-token:ro
      - ${AGENT_PLATFORM_MANAGER_CONTROL_DIR:?AGENT_PLATFORM_MANAGER_CONTROL_DIR must be set}:/run/agent-platform-manager:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
  agent-runtime:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_AGENT_RUNTIME_IMAGE:?AGENT_PLATFORM_AGENT_RUNTIME_IMAGE must be an immutable digest reference}
    user: ${AGENT_PLATFORM_UID:-1000}:${AGENT_PLATFORM_GID:-1000}
    read_only: true
    stop_grace_period: 30s
    environment:
      AGENT_PLATFORM_TECHNICAL_PROFILE: agent-platform-v1
      AGENT_RUNTIME_HOME: /var/lib/agent-platform/runtime
      AGENT_RUNTIME_HOST: 0.0.0.0
      AGENT_RUNTIME_PORT: "8766"
      AGENT_RUNTIME_MAX_BODY_BYTES: "33554432"
      AGENT_RUNTIME_TOKEN_FILE: /run/secrets/agent-platform/agent-runtime-token
      AGENT_PLATFORM_INTERNAL_URL: http://platform:8765
      AGENT_PLATFORM_INTERNAL_TOKEN_FILE: /run/secrets/agent-platform/agent-tool-token
      AGENT_MANAGER_EXECUTOR_SOCKET: /run/agent-platform-manager/manager.sock
      AGENT_MANAGER_EXECUTOR_TOKEN_FILE: /run/secrets/agent-platform/manager-executor-token
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/agent:/var/lib/agent-platform/runtime
      - ${AGENT_PLATFORM_SECRETS_DIR}/agent-runtime-token:/run/secrets/agent-platform/agent-runtime-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/agent-tool-token:/run/secrets/agent-platform/agent-tool-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/manager-executor-token:/run/secrets/agent-platform/manager-executor-token:ro
      - ${AGENT_PLATFORM_MANAGER_CONTROL_DIR}:/run/agent-platform-manager:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
  camofox:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_CAMOFOX_IMAGE:?AGENT_PLATFORM_CAMOFOX_IMAGE must be an immutable digest reference}
    user: ${AGENT_PLATFORM_UID:-1000}:${AGENT_PLATFORM_GID:-1000}
    shm_size: 1gb
    stop_grace_period: 30s
    environment:
      AGENT_PLATFORM_TECHNICAL_PROFILE: agent-platform-v1
      AGENT_PLATFORM_CAMOFOX_BIND_HOST: 0.0.0.0
      CAMOFOX_PORT: "9377"
      CAMOFOX_HOST: 0.0.0.0
      AGENT_PLATFORM_CAMOFOX_ACCESS_KEY_FILE: /run/secrets/agent-platform/camofox-access-key
      CAMOFOX_PROFILE_DIR: /var/lib/agent-platform/camofox/profiles
      CAMOFOX_COOKIES_DIR: /var/lib/agent-platform/camofox/cookies
      CAMOFOX_TRACES_DIR: /var/lib/agent-platform/camofox/traces
      XDG_CACHE_HOME: /var/lib/agent-platform/camofox/home/.cache
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/camofox:/var/lib/agent-platform/camofox
      - ${AGENT_PLATFORM_SECRETS_DIR}/camofox-access-key:/run/secrets/agent-platform/camofox-access-key:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
  searxng:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_SEARXNG_IMAGE:-ghcr.io/searxng/searxng@sha256:5286edb35782454ab8a102c5eff6b54bff745853191b46aeead95f225aa6dfb6}
    user: ${AGENT_PLATFORM_UID:-1000}:${AGENT_PLATFORM_GID:-1000}
    read_only: true
    environment:
      FORCE_OWNERSHIP: "false"
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/searxng/config:/etc/searxng:ro
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/searxng/cache:/var/cache/searxng
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  core:
    name: ${AGENT_PLATFORM_CORE_NETWORK:-agent-platform_core}
    external: true
