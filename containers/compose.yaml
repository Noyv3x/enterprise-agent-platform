name: ${AGENT_PLATFORM_COMPOSE_PROJECT:-agent-platform}

x-agent-platform-logging: &agent-platform-logging
  driver: json-file
  options:
    max-size: ${AGENT_PLATFORM_LOG_MAX_SIZE:-20m}
    max-file: ${AGENT_PLATFORM_LOG_MAX_FILES:-5}
    compress: "true"

x-agent-platform-service: &agent-platform-service
  init: true
  restart: unless-stopped
  networks:
    - core
  logging: *agent-platform-logging
  security_opt:
    - no-new-privileges:true
  labels:
    io.agent-platform.profile: agent-platform-v1

x-firecrawl-environment: &firecrawl-environment
  REDIS_URL: redis://firecrawl-redis:6379
  REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST: firecrawl-postgres
  POSTGRES_PORT: "5432"
  USE_DB_AUTHENTICATION: "false"
  NUM_WORKERS_PER_QUEUE: ${AGENT_PLATFORM_FIRECRAWL_NUM_WORKERS_PER_QUEUE:-2}
  CRAWL_CONCURRENT_REQUESTS: ${AGENT_PLATFORM_FIRECRAWL_CRAWL_CONCURRENT_REQUESTS:-4}
  MAX_CONCURRENT_JOBS: ${AGENT_PLATFORM_FIRECRAWL_MAX_CONCURRENT_JOBS:-3}
  BROWSER_POOL_SIZE: ${AGENT_PLATFORM_FIRECRAWL_BROWSER_POOL_SIZE:-3}
  NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
  NUQ_BACKEND: "pg"
  ENV: local
  LOGGING_LEVEL: ${AGENT_PLATFORM_FIRECRAWL_LOGGING_LEVEL:-info}

services:
  platform:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_PLATFORM_IMAGE:?AGENT_PLATFORM_PLATFORM_IMAGE must be an immutable digest reference}
    user: ${AGENT_PLATFORM_UID:-1000}:${AGENT_PLATFORM_GID:-1000}
    read_only: true
    stop_grace_period: 45s
    environment:
      AGENT_PLATFORM_TECHNICAL_PROFILE: agent-platform-v1
      AGENT_PLATFORM_DATA: /var/lib/agent-platform
      AGENT_PLATFORM_HOST_DATA_ROOT: ${AGENT_PLATFORM_DATA_ROOT:?AGENT_PLATFORM_DATA_ROOT must be set}
      AGENT_PLATFORM_HOST: 0.0.0.0
      AGENT_PLATFORM_PORT: "8765"
      AGENT_PLATFORM_DEPLOYMENT_MODE: container
      AGENT_PLATFORM_PUBLIC_BASE_URL: ${AGENT_PLATFORM_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      AGENT_PLATFORM_TRUSTED_PROXY: "1"
      AGENT_PLATFORM_AGENT_RUNTIME_URL: http://agent-runtime:8766
      AGENT_PLATFORM_CAMOFOX_URL: http://camofox:9377
      AGENT_PLATFORM_SEARXNG_API_URL: http://searxng:8080
      AGENT_PLATFORM_FIRECRAWL_API_URL: http://firecrawl-api:3002
      AGENT_PLATFORM_SESSION_SECRET_FILE: /run/secrets/agent-platform/session-secret
      AGENT_PLATFORM_AGENT_TOOL_TOKEN_FILE: /run/secrets/agent-platform/agent-tool-token
      AGENT_PLATFORM_AGENT_RUNTIME_TOKEN_FILE: /run/secrets/agent-platform/agent-runtime-token
      AGENT_PLATFORM_CAMOFOX_ACCESS_KEY_FILE: /run/secrets/agent-platform/camofox-access-key
      AGENT_PLATFORM_MANAGER_SOCKET: /run/agent-platform-manager/manager.sock
      AGENT_PLATFORM_MANAGER_TOKEN_FILE: /run/secrets/agent-platform/manager-token
    ports:
      - ${AGENT_PLATFORM_PLATFORM_BIND:-127.0.0.1:18080}:8765
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT:?AGENT_PLATFORM_DATA_ROOT must be set}/data:/var/lib/agent-platform
      - ${AGENT_PLATFORM_SECRETS_DIR:?AGENT_PLATFORM_SECRETS_DIR must be set}/session-secret:/run/secrets/agent-platform/session-secret:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/agent-tool-token:/run/secrets/agent-platform/agent-tool-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/agent-runtime-token:/run/secrets/agent-platform/agent-runtime-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/camofox-access-key:/run/secrets/agent-platform/camofox-access-key:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/manager-token:/run/secrets/agent-platform/manager-token:ro
      - ${AGENT_PLATFORM_MANAGER_CONTROL_DIR:?AGENT_PLATFORM_MANAGER_CONTROL_DIR must be set}:/run/agent-platform-manager:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
  agent-runtime:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_AGENT_RUNTIME_IMAGE:?AGENT_PLATFORM_AGENT_RUNTIME_IMAGE must be an immutable digest reference}
    user: ${AGENT_PLATFORM_UID:-1000}:${AGENT_PLATFORM_GID:-1000}
    read_only: true
    stop_grace_period: 30s
    environment:
      AGENT_PLATFORM_TECHNICAL_PROFILE: agent-platform-v1
      AGENT_RUNTIME_HOME: /var/lib/agent-platform/runtime
      AGENT_RUNTIME_HOST: 0.0.0.0
      AGENT_RUNTIME_PORT: "8766"
      AGENT_RUNTIME_MAX_BODY_BYTES: "33554432"
      AGENT_RUNTIME_TOKEN_FILE: /run/secrets/agent-platform/agent-runtime-token
      AGENT_PLATFORM_INTERNAL_URL: http://platform:8765
      AGENT_PLATFORM_INTERNAL_TOKEN_FILE: /run/secrets/agent-platform/agent-tool-token
      AGENT_MANAGER_EXECUTOR_SOCKET: /run/agent-platform-manager/manager.sock
      AGENT_MANAGER_EXECUTOR_TOKEN_FILE: /run/secrets/agent-platform/manager-executor-token
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/agent:/var/lib/agent-platform/runtime
      - ${AGENT_PLATFORM_SECRETS_DIR}/agent-runtime-token:/run/secrets/agent-platform/agent-runtime-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/agent-tool-token:/run/secrets/agent-platform/agent-tool-token:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/manager-executor-token:/run/secrets/agent-platform/manager-executor-token:ro
      - ${AGENT_PLATFORM_MANAGER_CONTROL_DIR}:/run/agent-platform-manager:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
  camofox:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_CAMOFOX_IMAGE:?AGENT_PLATFORM_CAMOFOX_IMAGE must be an immutable digest reference}
    user: ${AGENT_PLATFORM_UID:-1000}:${AGENT_PLATFORM_GID:-1000}
    shm_size: 1gb
    stop_grace_period: 30s
    environment:
      AGENT_PLATFORM_TECHNICAL_PROFILE: agent-platform-v1
      AGENT_PLATFORM_CAMOFOX_BIND_HOST: 0.0.0.0
      CAMOFOX_PORT: "9377"
      CAMOFOX_HOST: 0.0.0.0
      AGENT_PLATFORM_CAMOFOX_ACCESS_KEY_FILE: /run/secrets/agent-platform/camofox-access-key
      CAMOFOX_PROFILE_DIR: /var/lib/agent-platform/camofox/profiles
      CAMOFOX_COOKIES_DIR: /var/lib/agent-platform/camofox/cookies
      CAMOFOX_TRACES_DIR: /var/lib/agent-platform/camofox/traces
      XDG_CACHE_HOME: /var/lib/agent-platform/camofox/home/.cache
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/camofox:/var/lib/agent-platform/camofox
      - ${AGENT_PLATFORM_SECRETS_DIR}/camofox-access-key:/run/secrets/agent-platform/camofox-access-key:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
  searxng:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_SEARXNG_IMAGE:-ghcr.io/searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812}
    user: ${AGENT_PLATFORM_UID:-1000}:${AGENT_PLATFORM_GID:-1000}
    read_only: true
    environment:
      FORCE_OWNERSHIP: "false"
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/searxng/config:/etc/searxng:ro
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/searxng/cache:/var/cache/searxng
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  firecrawl-playwright:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_FIRECRAWL_PLAYWRIGHT_IMAGE:-ghcr.io/firecrawl/playwright-service@sha256:6359b0d9070f27400b4a9b615509be06919e40121fc1fdc42d4efeddf02653d2}
    shm_size: 1gb
    environment:
      PORT: "3000"
      BLOCK_MEDIA: ${AGENT_PLATFORM_FIRECRAWL_BLOCK_MEDIA:-false}
      MAX_CONCURRENT_PAGES: ${AGENT_PLATFORM_FIRECRAWL_CRAWL_CONCURRENT_REQUESTS:-4}
      ALLOW_LOCAL_WEBHOOKS: "false"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  firecrawl-redis:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_FIRECRAWL_REDIS_IMAGE:-redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005}
    command: [redis-server, --bind, 0.0.0.0, --appendonly, "yes"]
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/firecrawl/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  firecrawl-rabbitmq:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_FIRECRAWL_RABBITMQ_IMAGE:-rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69}
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/firecrawl/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  firecrawl-postgres:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_FIRECRAWL_POSTGRES_IMAGE:-ghcr.io/firecrawl/nuq-postgres@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/agent-platform/firecrawl-postgres-password
    volumes:
      - ${AGENT_PLATFORM_DATA_ROOT}/data/runtimes/firecrawl/postgres:/var/lib/postgresql/data
      - ${AGENT_PLATFORM_SECRETS_DIR}/firecrawl-postgres-password:/run/secrets/agent-platform/firecrawl-postgres-password:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s

  firecrawl-api:
    <<: *agent-platform-service
    image: ${AGENT_PLATFORM_FIRECRAWL_API_IMAGE:-ghcr.io/firecrawl/firecrawl@sha256:c2e8fc46fbc9dba57463b4b4f5c23fffe2aaf578a7691c5aaaf2cae58a01f80c}
    stop_grace_period: 45s
    environment:
      <<: *firecrawl-environment
      HOST: 0.0.0.0
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      HARNESS_STARTUP_TIMEOUT_MS: "60000"
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_healthy
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - 'export BULL_AUTH_KEY="$$(cat /run/secrets/agent-platform/firecrawl-bull-auth-key)"; export POSTGRES_PASSWORD="$$(cat /run/secrets/agent-platform/firecrawl-postgres-password)"; exec node dist/src/harness.js --start-docker'
    volumes:
      - ${AGENT_PLATFORM_SECRETS_DIR}/firecrawl-bull-auth-key:/run/secrets/agent-platform/firecrawl-bull-auth-key:ro
      - ${AGENT_PLATFORM_SECRETS_DIR}/firecrawl-postgres-password:/run/secrets/agent-platform/firecrawl-postgres-password:ro
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3002/v0/health/liveness").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

networks:
  core:
    name: ${AGENT_PLATFORM_CORE_NETWORK:-agent-platform_core}
    external: true
