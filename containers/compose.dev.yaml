services:
  platform:
    image: agent-platform/platform:dev
    build:
      context: ..
      dockerfile: containers/platform.Dockerfile
      args:
        SOURCE_COMMIT: development
        RELEASE_VERSION: development

  agent-runtime:
    image: agent-platform/agent-runtime:dev
    build:
      context: ..
      dockerfile: containers/agent-runtime.Dockerfile
      args:
        SOURCE_COMMIT: development
        RELEASE_VERSION: development

  camofox:
    image: agent-platform/camofox:dev
    build:
      context: ..
      dockerfile: containers/camofox.Dockerfile
      args:
        SOURCE_COMMIT: development
        RELEASE_VERSION: development

  searxng:
    volumes:
      - ./searxng:/etc/searxng:ro
